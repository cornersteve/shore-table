  };
});
reg('rt_play', (el)=>{
  // full bleed, same rule as cornhole: drop this screen's own padding
  el.style.padding = '0';
  el.innerHTML = `
    <div class="ch-stage" id="rtStage">
      <canvas id="rtCv"></canvas>
      <div class="ch-bar ch-bar--solid" id="rtBar"></div>
      <div class="ch-hint" id="rtHint" style="display:none;bottom:16%">Press and hold to pull back. Let go to toss.</div>
      <div class="ch-over" id="rtOver"><div class="ch-card">
        <h3 id="rtOT"></h3><div class="n" id="rtON"></div><div class="l" id="rtOL"></div>
        <div class="v" id="rtOV"></div>
        <button class="btn" id="rtOGo"></button>
        <button class="btn btn--ghost" id="rtOMenu">Back to the menu</button>
      </div></div>
    </div>`;
  const q = s => el.querySelector(s);
  const cv = q('#rtCv'), ctx = cv.getContext('2d'), hintEl = q('#rtHint');
  const acc = getComputedStyle(appEl).getPropertyValue('--accent').trim() || '#3a6ea5';
  // same warm-brass recipe as Quick Pour: mostly brass, a whisper of accent
  const BRASS = chMix(acc, '#c08040', 0.72);
  const C = { cream:'#ece7dd', dim:'#a79b8b', good:'#7fb069', bark:'#4a3527', bark2:'#3a2a1e',
              leaf:'#26402a', leaf2:'#1d3320', grass:'#223321', grass2:'#1b291b',
              string:'#d8cfc0' };

  /* fixed design space, cornhole pattern */
  const DW = 390, DH = 760;
  let W = 0, H = 0, SCL = 1, OX = 0, OY = 0;
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  function size(){
    const st = q('#rtStage');
    W = st.clientWidth; H = st.clientHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    SCL = Math.min(W / DW, H / DH);
    OX = (W - DW * SCL) / 2; OY = (H - DH * SCL) / 2;
  }

  /* ---- world geometry (design units) ---- */
  const PX = 170, PY = 150;          // string pivot: tip of the branch
  const L = 340, RING_R = 15;        // string length, ring radius
  const TRUNK_X = 336;               // trunk face
  const HOOK_X = TRUNK_X - 10;       // hook tip sticks out from the trunk
  const HOOK_TH = Math.asin((HOOK_X - PX) / L);         // string angle at the hook
  const HOOK_Y = PY + Math.cos(HOOK_TH) * L;
  const GROUND = 610;
  /* ---- physics + fairness ---- */
  const G = 4100;                    // px/s^2: release-to-tree is about 0.9s
  const DAMP = 0.12, BOUNCE = 0.38;
  const MAXPULL = 55 * Math.PI/180, RAMP = 1.6;         // full pull in 1.6s
  const V_CATCH = 170;               // arrive slower than this and it hooks
  const EPS_SHORT = 0.8 * Math.PI/180;                  // barely-short grace
  const CLOSE = 3.5 * Math.PI/180;   // "SO CLOSE" callout band
  const MINPULL = 6 * Math.PI/180;   // releases under this are not a throw
  const SWINGS = 10;

  let ring = { st:'rest', th:0, om:0 };   // st: rest | pull | swing | hooked
  let grabT = 0, resolved = true, hookT = 0, damp = DAMP;
  let throws = 0, hooks = 0, streak = 0, over = false;
  let floats = [];

  function bar(){
    q('#rtBar').innerHTML = `<span class="rd">Swing ${Math.min(throws + (resolved ? 1 : 0), SWINGS)} / ${SWINGS}</span>
      <button class="ch-rst" id="rtRst">Restart</button>
      <span class="sc"><span style="color:${C.good};font-size:15px">${hooks} hooked</span></span>`;
  }
  function addFloat(text, x, y, color){
    floats.push({ text, x, y, t0: performance.now(), color });
  }
  function vp(x, y){   // design coords -> viewport, for the DOM confetti
    const r = cv.getBoundingClientRect();
    return [r.left + OX + x*SCL, r.top + OY + y*SCL];
  }
  function resolveThrow(caught, now){
    resolved = true; throws++;
    // the hint stays through the first three tosses (enough time to re-read
    // it after a couple of misses), then gets out of the way
    if(throws >= 3) hintEl.style.display = 'none';
    if(caught){
      hooks++; streak++;
      ring.st = 'hooked'; ring.th = HOOK_TH; ring.om = 0; hookT = now;
      addFloat(streak >= 2 ? streak + ' IN A ROW!' : 'HOOKED!', HOOK_X - 40, HOOK_Y - 46, C.good);
      const [cx, cy] = vp(HOOK_X, HOOK_Y);
      confettiBurst(cx, cy);
    } else {
      streak = 0;
      damp = DAMP * 4;   // missed swings die down fast so the next grab comes quick
    }
    bar();
    if(throws >= SWINGS) setTimeout(()=> showOver(), caught ? 1100 : 800);
  }
  function showOver(){
    if(over) return;
    over = true;
    const b = rtBest(), isBest = hooks > b;
    if(isBest){ try{ localStorage.setItem('st_rt_best', String(hooks)); }catch(e){} }
    q('#rtOT').textContent = hooks === SWINGS ? 'Perfect round!' : (isBest && b >= 0) ? 'New high score!' : 'Round over';
    q('#rtON').textContent = hooks + ' / ' + SWINGS;
    q('#rtOL').textContent = 'rings on the hook';
    q('#rtOV').textContent =
      isBest && b >= 0 ? 'New best on this phone. Old best: ' + b + '.' :
      isBest           ? 'That is the score to beat on this phone.' :
                         'Best on this phone: ' + b + '. Pass it on.';
    q('#rtOGo').textContent = 'Swing again';
    q('#rtOGo').onclick = ()=>{ q('#rtOver').classList.remove('show'); startRound(); };
    q('#rtOver').classList.add('show');
  }
  function startRound(){
    ring = { st:'rest', th:0, om:0 };
    resolved = true; damp = DAMP;
    throws = 0; hooks = 0; streak = 0; over = false; floats = [];
    hintEl.style.display = 'block';
    bar();
  }
  function grab(now){
    // grab is allowed at rest, or mid-settle once the throw has resolved;
    // never mid-flight, never off the hook
    if(over || throws >= SWINGS) return;
    if(ring.st === 'pull' || ring.st === 'hooked' || (ring.st === 'swing' && !resolved)) return;
    // pulling continues from wherever the ring hangs right now
    const frac = ring.th < 0 ? Math.min(1, -ring.th / MAXPULL) : 0;
    grabT = now - frac * RAMP * 1000;
    ring.st = 'pull'; ring.om = 0;
  }
  function release(now){
    if(ring.st !== 'pull') return;
    const pull = -ring.th;
    ring.om = 0;
    if(pull < MINPULL){ ring.st = 'swing'; resolved = true; damp = DAMP * 4; return; }   // a fumble, not a throw
    ring.st = 'swing'; resolved = false; damp = DAMP;
  }
  // capture keeps the release firing even when the finger drifts off the
  // canvas; it can throw for synthetic events, so it never gates the grab
  cv.addEventListener('pointerdown', (e)=>{ try{ cv.setPointerCapture(e.pointerId); }catch(err){} grab(performance.now()); });
  // the hold is game input: kill the OS long-press behaviors the CSS cannot
  // (iOS magnifier loupe, Android long-press menu). preventDefault on
  // touchstart does not stop the pointer events above.
  cv.addEventListener('touchstart', (e)=> e.preventDefault(), {passive:false});
  cv.addEventListener('contextmenu', (e)=> e.preventDefault());
  cv.addEventListener('pointerup',     ()=> release(performance.now()));
  cv.addEventListener('pointercancel', ()=> release(performance.now()));
  q('#rtOMenu').onclick = ()=> go('rt_intro',{exit:true});
  q('#rtBar').addEventListener('click', (e)=>{
    if(e.target.id === 'rtRst') go('rt_intro',{exit:true});
  });

  /* ---- drawing ---- */
  function ringPos(th){ return { x: PX + Math.sin(th)*L, y: PY + Math.cos(th)*L }; }
  function drawWorld(now){
    // dusk sky
    ctx.fillStyle = '#181d29'; ctx.fillRect(-OX/SCL, -OY/SCL, DW + 2*OX/SCL, GROUND + OY/SCL);
    ctx.fillStyle = 'rgba(74,58,46,.5)'; ctx.fillRect(-OX/SCL, GROUND - 90, DW + 2*OX/SCL, 90);
    for(let i = 0; i < 22; i++){
      ctx.globalAlpha = 0.25 + ((i*29) % 10)/28;
      ctx.fillStyle = C.cream;
      ctx.fillRect((i*97) % DW, (i*53) % 170, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
    // the main lodge, in the background: long gray building with warm
    // windows and the green barrel-awning walkway to the lit front door,
    // venue logo on the awning face (the resort's signature entrance)
    ctx.fillStyle = '#333942';
    ctx.fillRect(-OX/SCL, 500, 268 + OX/SCL, 112);
    ctx.fillStyle = '#262c34';   // low shingle roof with a slight overhang
    ctx.fillRect(-OX/SCL, 480, 274 + OX/SCL, 22);
    ctx.fillStyle = 'rgba(236,231,221,.14)';
    ctx.fillRect(-OX/SCL, 480, 274 + OX/SCL, 2.5);
    for(const wx of [10, 54, 232]){   // warm-lit windows, white trim
      ctx.fillStyle = 'rgba(255,205,130,.7)'; ctx.fillRect(wx, 528, 30, 26);
      ctx.strokeStyle = '#d9d4c8'; ctx.lineWidth = 2; ctx.strokeRect(wx, 528, 30, 26);
      ctx.beginPath(); ctx.moveTo(wx + 15, 528); ctx.lineTo(wx + 15, 554); ctx.stroke();
    }
    // walkway opening under the awning, glowing door at the end
    ctx.fillStyle = '#151815'; ctx.fillRect(106, 552, 104, 60);
    ctx.fillStyle = 'rgba(255,190,110,.5)'; ctx.fillRect(140, 566, 36, 46);
    ctx.strokeStyle = 'rgba(236,231,221,.25)'; ctx.lineWidth = 2;   // railings
    ctx.beginPath(); ctx.moveTo(106, 584); ctx.lineTo(138, 584); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(178, 584); ctx.lineTo(210, 584); ctx.stroke();
    // wood posts, then the green barrel arch over them
    ctx.fillStyle = '#6b4423';
    ctx.fillRect(100, 546, 8, 66); ctx.fillRect(208, 546, 8, 66);
    ctx.fillStyle = '#2e5c40';
    ctx.beginPath();
    ctx.moveTo(96, 558); ctx.lineTo(96, 534);
    ctx.quadraticCurveTo(96, 508, 130, 502);
    ctx.quadraticCurveTo(158, 498, 186, 502);
    ctx.quadraticCurveTo(220, 508, 220, 534);
    ctx.lineTo(220, 558);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#24492f'; ctx.fillRect(96, 552, 124, 6);   // bottom rim
    if(rt.logoImg){
      const bw = 100, bh = 44;
      const iw = rt.logoImg.naturalWidth || 1, ih = rt.logoImg.naturalHeight || 1;
      const fit = Math.min(bw/iw, bh/ih);
      ctx.save(); ctx.globalAlpha = 0.95;
      // clip to the arch so a full-rectangle logo cannot poke past the canvas
      ctx.beginPath();
      ctx.moveTo(96, 558); ctx.lineTo(96, 534);
      ctx.quadraticCurveTo(96, 508, 130, 502);
      ctx.quadraticCurveTo(158, 498, 186, 502);
      ctx.quadraticCurveTo(220, 508, 220, 534);
      ctx.lineTo(220, 558);
      ctx.closePath(); ctx.clip();
      ctx.drawImage(rt.logoImg, 158 - iw*fit/2, 527 - ih*fit/2, iw*fit, ih*fit);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ece7dd';
      ctx.font = '700 12px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center';
      ctx.fillText((venue().logo || venue().name).toUpperCase().slice(0, 13), 158, 531);
    }
    // grass
    ctx.fillStyle = C.grass; ctx.fillRect(-OX/SCL, GROUND, DW + 2*OX/SCL, DH - GROUND + OY/SCL);
    ctx.fillStyle = C.grass2; ctx.fillRect(-OX/SCL, GROUND + 46, DW + 2*OX/SCL, DH);
    // trunk + roots
    ctx.fillStyle = C.bark;
    ctx.beginPath();
    ctx.moveTo(TRUNK_X, -OY/SCL);
    ctx.lineTo(TRUNK_X, GROUND + 8);
    ctx.quadraticCurveTo(TRUNK_X - 18, GROUND + 26, TRUNK_X - 30, GROUND + 30);
    ctx.lineTo(DW + OX/SCL, GROUND + 30);
    ctx.lineTo(DW + OX/SCL, -OY/SCL);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.bark2;
    for(let i = 0; i < 5; i++){
      const bx = TRUNK_X + 8 + i*11;
      ctx.fillRect(bx, 120 + (i*67 % 90), 3.5, 150 + (i*41 % 120));
    }
    // canopy
    ctx.fillStyle = C.leaf2;
    ctx.beginPath(); ctx.ellipse(330, 30, 190, 92, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(230, 66, 96, 54, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.leaf;
    ctx.beginPath(); ctx.ellipse(350, 52, 130, 66, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(272, 92, 74, 40, 0, 0, Math.PI*2); ctx.fill();
    // branch out to the pivot
    ctx.strokeStyle = '#5a4331'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(TRUNK_X + 6, 172); ctx.quadraticCurveTo(260, 158, PX - 4, PY); ctx.stroke();
    // rope wrap at the tip
    ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = 2.5;
    for(let i = 0; i < 3; i++){ ctx.beginPath(); ctx.moveTo(PX - 7 + i*4, PY - 7); ctx.lineTo(PX - 3 + i*4, PY + 6); ctx.stroke(); }
    // the hook: mounting plate on the trunk, arm out, tip curling up
    ctx.fillStyle = '#30281f'; ctx.fillRect(TRUNK_X - 2, HOOK_Y - 10, 7, 20);
    ctx.strokeStyle = BRASS; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(TRUNK_X + 1, HOOK_Y);
    ctx.lineTo(HOOK_X + 2, HOOK_Y);
    ctx.arc(HOOK_X + 2, HOOK_Y - 7, 7, Math.PI/2, Math.PI, false);
    ctx.stroke();
  }
  function drawRing(now){
    let th = ring.th, p;
    if(ring.st === 'rest') th = 0.02 * Math.sin(now/900);   // idle sway
    if(ring.st === 'hooked'){
      // hanging on the hook, wobble dying off
      const age = (now - hookT)/1000;
      const wob = Math.exp(-age*3) * 0.5 * Math.sin(age*14);
      p = { x: HOOK_X + 2 + Math.sin(wob)*8, y: HOOK_Y - 4 + RING_R - 3 + Math.abs(Math.cos(wob))*2 };
    } else {
      p = ringPos(th);
    }
    // string
    ctx.strokeStyle = C.string; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(p.x, p.y - (ring.st === 'hooked' ? RING_R - 3 : 0)); ctx.stroke();
    // ring: brass torus with a highlight
    ctx.strokeStyle = chMix(BRASS, '#2a1d10', 0.35); ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(p.x, p.y, RING_R, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = BRASS; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(p.x, p.y, RING_R, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, RING_R, -2.4, -0.9); ctx.stroke();
    // pull guide: a faint arc showing the swing path while pulling
    if(ring.st === 'pull'){
      ctx.strokeStyle = 'rgba(236,231,221,.14)'; ctx.lineWidth = 2;
      ctx.setLineDash([3, 7]);
      ctx.beginPath(); ctx.arc(PX, PY, L, Math.PI/2 - HOOK_TH - 0.02, Math.PI/2 - ring.th, false); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  function draw(now){
    ctx.fillStyle = '#14120f'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(OX, OY); ctx.scale(SCL, SCL);
    drawWorld(now);
    drawRing(now);
    for(let f = floats.length - 1; f >= 0; f--){
      const fl = floats[f], age = now - fl.t0;
      if(age > 1300){ floats.splice(f, 1); continue; }
      ctx.globalAlpha = age < 150 ? age/150 : age > 1000 ? (1300-age)/300 : 1;
      ctx.fillStyle = fl.color;
      ctx.font = '800 16px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center';
      ctx.fillText(fl.text, fl.x, fl.y - age*0.012);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
  let lastT = 0;
  function step(now, dt){
    if(ring.st === 'pull'){
      ring.th = -MAXPULL * Math.min(1, (now - grabT)/(RAMP*1000));
    } else if(ring.st === 'swing'){
      const prevOm = ring.om;
      ring.om += (-(G/L) * Math.sin(ring.th) - damp * ring.om) * dt;
      ring.th += ring.om * dt;
      // reached the tree: catch if it arrived soft, clang off if not
      if(ring.th >= HOOK_TH && ring.om > 0){
        const v = ring.om * L;
        if(!resolved && v < V_CATCH){ resolveThrow(true, now); }
        else {
          ring.th = HOOK_TH; ring.om = -ring.om * BOUNCE;
          if(!resolved){
            addFloat('CLANG!', HOOK_X - 46, HOOK_Y - 46, C.dim);
            resolveThrow(false, now);
          }
        }
      }
      // forward peak without reaching the tree: short (a hair short still catches)
      else if(!resolved && ring.th > 0 && prevOm > 0 && ring.om <= 0){
        if(HOOK_TH - ring.th <= EPS_SHORT){
          ring.th = HOOK_TH;
          resolveThrow(true, now);
        } else {
          const p = ringPos(ring.th);
          addFloat(HOOK_TH - ring.th <= CLOSE ? 'SO CLOSE!' : 'SHORT', p.x, p.y - 30, C.dim);
          resolveThrow(false, now);
        }
      }
      // settled back to hanging
      if(ring.st === 'swing' && resolved && Math.abs(ring.th) < 0.03 && Math.abs(ring.om) < 0.2){
        ring.st = 'rest'; ring.th = 0; ring.om = 0; damp = DAMP;
        bar();
      }
    } else if(ring.st === 'hooked'){
      // hold the catch a beat, then hand the ring back (unless the round is done)
      if(now - hookT > 1000 && throws < SWINGS){
        ring.st = 'swing'; ring.th = HOOK_TH - 0.02; ring.om = -0.6; damp = DAMP * 4;
      }
    }
  }
  function tick(now){
    if(!cv.isConnected){ ro.disconnect(); return; }
    const dt = Math.min(0.033, (now - lastT)/1000); lastT = now;
    step(now, dt);
    draw(now);
    requestAnimationFrame(tick);
  }
  rt.state = ()=> ({ st: ring.st, th: +ring.th.toFixed(4), throws, hooks, streak, over,
    best: rtBest(), hookTh: +HOOK_TH.toFixed(4) });
  rt.throwAt = (deg)=>{   // test hook: release a swing at an exact pull-back angle
    if(over || throws >= SWINGS) return false;
    ring.st = 'swing'; ring.th = -deg * Math.PI/180; ring.om = 0;
    resolved = false; damp = DAMP;
    return true;
  };
  // test hooks (hr.drawNow pattern): rAF pauses in hidden tabs, so tests can
  // drive the sim on a synthetic clock and force frames directly
  let simT = null;
  rt.stepMs = (ms)=>{
    if(simT === null) simT = performance.now();
    for(let t = 0; t < ms; t += 16){ simT += 16; step(simT, 0.016); }
    return rt.state();
  };
  rt.drawNow = ()=> draw(simT === null ? performance.now() : simT);
  // grab/release on the sim clock, so hold-duration tests are deterministic
  rt.grab    = ()=> grab(simT === null ? performance.now() : simT);
  rt.release = ()=> release(simT === null ? performance.now() : simT);
  const ro = new ResizeObserver(size);
  ro.observe(q('#rtStage'));
  size();
  startRound();
  requestAnimationFrame(t => { lastT = t; tick(t); });
});

reg('sb_intro__back', ()=> go('landing'));
reg('sb_form__back', ()=> go('sb_intro'));
/* The active form for this venue (35_feedback_forms.sql): the venue's own
   row while its paid form_custom flag is on, else the operator's global row.
   Fails OPEN everywhere: no config at all = the stock form, a missing core
   key = shown, junk extras = skipped. The comment box always shows. */
function sbActiveForm(){
  const v = venue();
  const f = (v && v.formCustom && FORMS[state.venue]) ? FORMS[state.venue] : (FORMS.global || null);
  const core = (f && f.core && typeof f.core === 'object') ? f.core : {};
  const extras = (f && Array.isArray(f.extras) ? f.extras : []).filter(x =>
    x && typeof x.id === 'string' && x.label &&
    (x.type === 'rating' || x.type === 'text' ||
     (x.type === 'choice' && Array.isArray(x.opts) && x.opts.length >= 2)));
  return { show: id => core[id] !== false, extras };
}
reg('sb_form', (el)=>{
  const v=venue();
  const form=sbActiveForm();
  const qs=SB_CORE.filter(q=>form.show(q.id));
  el.innerHTML=`<div class="eyebrow">Your honest take · ${venue().name}</div>`;
  const wrap=document.createElement('div'); el.appendChild(wrap);
  const rateBlock=(label, hint, onPick)=>{
    const block=document.createElement('div'); block.className='sbq';
    block.innerHTML=`<div class="sbq__label">${escHtml(label)}</div>${hint?`<div class="sbq__hint">${escHtml(hint)}</div>`:''}`;
    const rate=document.createElement('div'); rate.className='rate';
    for(let n=1;n<=5;n++){
      const d=h(`<button class="rate__dot" aria-label="${n} out of 5">${n}</button>`);
      d.onclick=()=>{onPick(n);rate.querySelectorAll('.rate__dot').forEach((x,i)=>x.classList.toggle('on',i<n));};
      rate.appendChild(d);
    }
    block.appendChild(rate);
    block.appendChild(h(`<div class="rate__ends"><span>Poor</span><span>Excellent</span></div>`));
    return block;
  };
  qs.forEach(q=>{
    if(q.type==='rate'){
      wrap.appendChild(rateBlock(q.label, q.hint, n=>{ sb.answers[q.id]=n; }));
      return;
    }
    const block=document.createElement('div'); block.className='sbq';
    block.innerHTML=`<div class="sbq__label">${q.label}</div>${q.hint?`<div class="sbq__hint">${q.hint}</div>`:''}`;
    const row=document.createElement('div'); row.className='pillrow';
    q.options.forEach(opt=>{
      const p=h(`<button class="pill">${opt}</button>`);
      p.onclick=()=>{sb.answers[q.id]=opt;row.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x===p));};
      row.appendChild(p);
    });
    block.appendChild(row);
    wrap.appendChild(block);
  });
  // operator-built extra questions (answers keyed by permanent question id)
  sb.extra={};
  form.extras.forEach(q=>{
    if(q.type==='rating'){
      wrap.appendChild(rateBlock(q.label, q.hint, n=>{ sb.extra[q.id]=n; }));
      return;
    }
    const block=document.createElement('div'); block.className='sbq';
    block.innerHTML=`<div class="sbq__label">${escHtml(q.label)}</div>${q.multi?`<div class="sbq__hint">Pick any that apply</div>`:''}`;
    if(q.type==='choice'){
      const row=document.createElement('div'); row.className='pillrow';
      q.opts.forEach(opt=>{
        const p=h(`<button class="pill">${escHtml(String(opt))}</button>`);
        p.onclick=()=>{
          if(q.multi){
            p.classList.toggle('on');
            const picked=[...row.querySelectorAll('.pill.on')].map(x=>x.textContent);
            if(picked.length) sb.extra[q.id]=picked; else delete sb.extra[q.id];
          } else {
            sb.extra[q.id]=String(opt);
            row.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x===p));
          }
        };
        row.appendChild(p);
      });
      block.appendChild(row);
    } else {
      const ta=h(`<textarea maxlength="240" rows="2" placeholder="Optional"></textarea>`);
      ta.addEventListener('input',()=>{ const t=ta.value.trim(); if(t) sb.extra[q.id]=t; else delete sb.extra[q.id]; });
      block.appendChild(ta);
    }
    wrap.appendChild(block);
  });
  const c=document.createElement('div'); c.className='sbq';
  c.innerHTML=`<div class="sbq__label">Anything else? <span style="color:var(--ink-dim);font-weight:400;font-size:13px">(optional)</span></div>`;
  const ta=h(`<textarea placeholder="Share any other anonymous feedback you'd like..."></textarea>`);
  c.appendChild(ta); wrap.appendChild(c);
  const send=h(`<button class="btn" style="margin-top:20px">Send it</button>`);
  send.onclick=async ()=>{
    sb.answers.comment=ta.value.trim();
    send.disabled=true; send.textContent='Sending…';
    const venueId=state.venue;
    // Record once per venue per calendar day. The screen always advances to the
    // thank-you; the server only actually saves for an active, un-paused venue.
    if(!surveyDoneToday(venueId)){
      logEvent('survey_submit');
      try {
        // p_extra is only sent when there are extra answers: extras can only
        // render once 35_feedback_forms.sql exists, so the 7-arg call keeps
        // working against a pre-35 database (new code + old schema rule)
        const payload = {
          p_venue_id:  venueId,
          p_food:      sb.answers.food      ?? null,
          p_service:   sb.answers.service   ?? null,
          p_discovery: sb.answers.discovery ?? null,
          p_plate:     sb.answers.plate     ?? null,
          p_visit:     sb.answers.visit     ?? null,
          p_comment:   sb.answers.comment   || null
        };
        if(sb.extra && Object.keys(sb.extra).length) payload.p_extra = sb.extra;
        await db.rpc('submit_survey', payload);
      } catch(e){ /* offline: still thank the diner */ }
      surveyMarkDone(venueId);
    }
    go('sb_done',{back:false});
  };
  wrap.appendChild(send);
});

/* =========================================================================
   WORDLE  (solo; unseen-first words so a device never repeats until the
   whole pool is exhausted, same rule as every other game. The word itself
   is the permanent id, and a venue's custom words deal first.)
   ========================================================================= */
let wd={};
function startWordle(){
  const pick = freshDeck(WORDS,'st_seen_wordy',1)[0];
  const answer = WORDS[pick] ? WORDS[pick].id : 'BEACH';   // pool can't really be empty; fail open
  markSeen('st_seen_wordy', answer);
  wd={answer,guesses:[],cur:"",done:false,keystate:{},msg:""};
}
function scoreGuess(g,a){
  const res=Array(5).fill('x'), cnt={};
  for(const c of a) cnt[c]=(cnt[c]||0)+1;
  for(let i=0;i<5;i++){ if(g[i]===a[i]){res[i]='g';cnt[g[i]]--;} }
  for(let i=0;i<5;i++){ if(res[i]==='g')continue; if(cnt[g[i]]>0){res[i]='y';cnt[g[i]]--;} }
  return res;
}
reg('wordle', (el)=>{
  function render(){
    let rows='';
    for(let r=0;r<6;r++){
      let cells='';
      const guess=wd.guesses[r];
      if(guess){ const sc=scoreGuess(guess,wd.answer); for(let i=0;i<5;i++) cells+=`<div class="wcell ${sc[i]}">${guess[i]}</div>`; }
      else if(r===wd.guesses.length && !wd.done){ for(let i=0;i<5;i++){const ch=wd.cur[i]||'';cells+=`<div class="wcell ${ch?'filled':''}">${ch}</div>`;} }
      else { for(let i=0;i<5;i++) cells+=`<div class="wcell"></div>`; }
      rows+=`<div class="wrow">${cells}</div>`;
    }
    const won=wd.done && wd.guesses[wd.guesses.length-1]===wd.answer;
    let body;
    if(wd.done){
      body=`<div class="stack">
        <div style="text-align:center;font-family:var(--font-d);font-weight:700;font-size:19px">${won?'Nice. You got it.':`The word was <span style="color:var(--accent)">${wd.answer}</span>`}</div>
        <button class="btn" id="again">Play again</button>
        <button class="btn btn--ghost" id="home">Back to games</button>
      </div>`;
    } else {
      const krows=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
      let kb='';
      krows.forEach((row,ri)=>{
        let keys = ri===2 ? `<button class="wkey wide enter" data-k="ENTER">Enter</button>` : '';
        for(const c of row) keys+=`<button class="wkey ${wd.keystate[c]||''}" data-k="${c}">${c}</button>`;
        if(ri===2) keys+=`<button class="wkey wide" data-k="DEL">⌫</button>`;
        kb+=`<div class="wkrow">${keys}</div>`;
      });
      body=`<div class="wkeys">${kb}</div>`;
    }
    el.innerHTML=`<div class="eyebrow">Wordy</div><div class="wgrid">${rows}</div><div class="wmsg">${wd.msg||''}</div>${body}`;
    if(wd.done){
      el.querySelector('#again').onclick=()=>{startWordle();render();};
      el.querySelector('#home').onclick=()=>go('hub');
    } else {
      el.querySelectorAll('.wkey').forEach(k=> k.onclick=()=>press(k.dataset.k));
    }
  }
  function press(k){
    if(wd.done)return; wd.msg='';
    if(k==='DEL'){ wd.cur=wd.cur.slice(0,-1); return render(); }
    if(k==='ENTER'){
      if(wd.cur.length<5){ wd.msg='Not enough letters'; return render(); }
      const g=wd.cur; wd.guesses.push(g);
      const sc=scoreGuess(g,wd.answer), pri={g:3,y:2,x:1};
      for(let i=0;i<5;i++){ const c=g[i]; if(!wd.keystate[c]||pri[sc[i]]>pri[wd.keystate[c]]) wd.keystate[c]=sc[i]; }
      wd.cur='';
      if(g===wd.answer || wd.guesses.length>=6) wd.done=true;
      return render();
    }
    if(/^[A-Z]$/.test(k) && wd.cur.length<5){ wd.cur+=k; render(); }
  }
  render();
});

/* =========================================================================
   ALL TALK  (2 to 8 players, bid and prove, 5 rounds)
   The auction happens OUT LOUD; the app is dealer, timer, and scorekeeper,
   same philosophy as Who Invited You?. The table taps who won the bidding,
   sets the bid, and the prover gets 30 seconds while the table counts on
   the tally screen. The app NEVER judges whether an answer counts; the
   table does. Hit the bid = 1 point flat; most rounds won wins.
   ========================================================================= */
let at={};
const AT_SECONDS = 30;
reg('at_intro', (el)=>{
  el.innerHTML=`
    <div class="eyebrow">All Talk</div>
    <h1 class="big">Talk a big game. Then back it up.</h1>
    <div class="howto">
      <div class="howto__step"><span class="howto__n">1</span><span>The phone deals a category, like dog breeds or pizza toppings.</span></div>
      <div class="howto__step"><span class="howto__n">2</span><span>Auction it out loud. Whoever bids the highest number has to prove it.</span></div>
      <div class="howto__step"><span class="howto__n">3</span><span>They get 30 seconds while the table counts. Hit the bid, win the round. Five rounds.</span></div>
    </div>
    <div class="stack">
      <button class="btn" id="atGo">Add players · 2 to 8</button>
    </div>
    <div class="spacer"></div>`;
  el.querySelector('#atGo').onclick=()=>{ at={players:[]}; go('at_setup',{exit:true}); };
});
reg('at_setup', (el)=>{
  el.innerHTML=`
    <div class="eyebrow">All Talk · setup</div>
    <h1 class="big">Who's playing?</h1>
    <p class="lede">Add everyone at the table. 2 to 8 players.</p>
    <div class="players" id="chips"></div>
    <div class="nameadd">
      <input id="nameInput" placeholder="Add a name" autocomplete="off" maxlength="14" />
      <button class="btn sm" id="addBtn" style="padding-left:20px;padding-right:20px">Add</button>
    </div>
    <div class="namehint" id="nameHint"></div>
    <button class="btn" id="startAt" style="margin-top:14px;${at.players.length<2?'opacity:.4':''}" ${at.players.length<2?'disabled':''}>Start ›</button>
    <div class="spacer"></div>`;
  const chips=el.querySelector('#chips'), input=el.querySelector('#nameInput');
  if(!at.icon) at.icon={};
  if(!at.iconPool) at.iconPool=shuffle(HS_ICONS);
  function renderChips(){
    chips.innerHTML='';
    at.players.forEach((p,idx)=>{
      const c=h(`<span class="namechip"><span class="pico">${at.icon[p]||''}</span> ${p}<button aria-label="Remove ${p}">×</button></span>`);
      c.querySelector('button').onclick=()=>{const nm=at.players[idx];at.players.splice(idx,1);delete at.icon[nm];renderChips();refreshStart();};
      chips.appendChild(c);
    });
  }
  // Pending typed name counts toward the minimum; Start adds it (see below).
  function refreshStart(){const b=el.querySelector('#startAt');const ok=at.players.length+(input.value.trim()?1:0)>=2;b.disabled=!ok;b.style.opacity=ok?'1':'.4';}
  const hint=el.querySelector('#nameHint');
  function add(){
    const v=input.value.trim();
    if(!v)return false;
    if(at.players.length>=8){hint.textContent="That's the max of 8 players. Remove someone first.";return false;}
    if(at.players.some(p=>p.toLowerCase()===v.toLowerCase())){hint.textContent='Someone already has that name. Add a last initial?';return false;}
    const used=new Set(Object.values(at.icon));
    at.icon[v]=at.iconPool.find(x=>!used.has(x))||HS_ICONS[Object.keys(at.icon).length%HS_ICONS.length];
    hint.textContent=''; at.players.push(v);input.value='';input.focus();renderChips();refreshStart();
    return true;
  }
  el.querySelector('#addBtn').onclick=()=>{ add(); };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter')add(); else hint.textContent=''; });
  input.addEventListener('input', refreshStart);
  el.querySelector('#startAt').onclick=()=>{
    // A name left in the box is meant to be a player, not discarded.
    if(input.value.trim() && !add()){ input.focus(); return; }
    if(at.players.length<2)return;
    logPlay('all_talk');
    at.scores={}; at.players.forEach(p=>at.scores[p]=0);
    at.deck=freshDeck(ATCATS,'st_seen_alltalk',5);
    at.round=0;
    go('at_round',{exit:true});
  };
});
reg('at_round', (el)=>{

    <div class="nudges">
      <button class="nudge" data-d="-5">-5</button>
      <button class="nudge" data-d="-1">-1</button>
      <button class="nudge" data-d="1">+1</button>
      <button class="nudge" data-d="5">+5</button>
    </div>
    <button class="btn" id="atClock" style="margin-top:18px;opacity:.4">Start the 30 seconds ›</button>
    <div class="namehint" id="atHint" style="text-align:center"></div>
    <div class="spacer"></div>`;
  const who=el.querySelector('#atWho'), bidN=el.querySelector('#atBidN'), clock=el.querySelector('#atClock'), hint=el.querySelector('#atHint');
  at.players.forEach(p=>{
    const b=h(`<button class="atp" aria-pressed="false">${at.icon[p]||''} ${p}</button>`);
    b.onclick=()=>{
      at.prover=p;
      who.querySelectorAll('.atp').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
      clock.style.opacity='1'; hint.textContent='';
    };
    who.appendChild(b);
  });
  el.querySelectorAll('.nudge').forEach(b=> b.onclick=()=>{
    at.bid=Math.max(1,Math.min(99,at.bid+(+b.dataset.d)));
    bidN.textContent=at.bid;
  });
  // Never a silently dead button: tapping before a bidder is picked explains
  // itself instead of doing nothing (the original disabled version read as
  // broken, the operator hit exactly that).
  clock.onclick=()=>{
    if(!at.prover){ hint.textContent='Tap the highest bidder first.'; return; }
    go('at_prove',{exit:true});
  };
});
reg('at_prove', (el)=>{
  const item=ATCATS[at.deck[at.round]];
  at.count=0;
  const deadline=performance.now()+AT_SECONDS*1000;
  el.innerHTML=`
    <div class="eyebrow">${at.icon[at.prover]||''} ${at.prover} · needs ${at.bid}</div>
    <div class="hsq" style="text-align:center">${item.cat}</div>
    <div class="at-clock" id="atClk">${AT_SECONDS}</div>
    <button class="at-tally" id="atTally">
      <div class="n" id="atN">0</div>
      <div class="of">of ${at.bid}</div>
      <div class="tap">Table taps once per answer</div>
    </button>
    <button class="btn btn--ghost" id="atCall" style="margin-top:14px">Call it early</button>
    <div class="spacer"></div>`;
  const clk=el.querySelector('#atClk'), n=el.querySelector('#atN'), tally=el.querySelector('#atTally');
  let done=false;
  function finish(){
    if(done) return; done=true;
    clearInterval(at.timerId);
    const win = at.count>=at.bid;
    if(win) at.scores[at.prover]++;
    const sorted=[...at.players].sort((a,b)=>at.scores[b]-at.scores[a]);
    const top=at.scores[sorted[0]];
    const rows=sorted.map((p,i)=>`<div class="scorerow ${at.scores[p]===top&&top>0?'lead':''}"><span class="who"><span class="rank">${i+1}</span><span class="pico">${at.icon[p]||''}</span>${p}</span><span class="pts">${at.scores[p]}</span></div>`).join('');
    el.innerHTML=`
      <div class="eyebrow">All Talk · round ${at.round+1} of ${at.deck.length}</div>
      <div class="hsq" style="text-align:center">${win?`${at.prover} said ${at.bid}. ${at.prover} delivered.`:`${at.prover} bid ${at.bid}, made it to ${at.count}.`}</div>
      <div class="verdict"><span>${win?'Proved it +1':'All talk'}</span></div>
      <div class="standings__h">Standings · most rounds won</div>
      <div class="scoreboard">${rows}</div>
      <button class="btn" id="atNext" style="margin-top:16px">${at.round+1<at.deck.length?'Next round':'See who wins'} ›</button>
      <div class="spacer"></div>`;
    el.querySelector('#atNext').onclick=()=>{
      at.round++;
      at.round<at.deck.length ? go('at_round',{exit:true}) : go('at_final',{exit:true});
    };
  }
  tally.onclick=()=>{
    if(done) return;
    at.count++; n.textContent=at.count;
    if(at.count>=at.bid){
      const r=tally.getBoundingClientRect();
      confettiBurst(r.left+r.width/2, r.top+r.height/2);
      setTimeout(finish, 650);   // let the confetti land before the reveal
    }
  };
  el.querySelector('#atCall').onclick=finish;
  at.timerId=setInterval(()=>{
    if(!el.isConnected){ clearInterval(at.timerId); return; }   // quit mid-round
    const left=Math.max(0, Math.ceil((deadline-performance.now())/1000));
    clk.textContent=left;
    if(left<=5) clk.classList.add('low');
    if(left<=0) finish();
  }, 200);
});
reg('at_final', (el)=>{
  const sorted=[...at.players].sort((a,b)=>at.scores[b]-at.scores[a]);
  const top=at.scores[sorted[0]];
  const winners=sorted.filter(p=>at.scores[p]===top);
  const tie=winners.length>1;
  const rows=sorted.map((p,i)=>`<div class="scorerow ${at.scores[p]===top?'lead':''}"><span class="who"><span class="rank">${i+1}</span><span class="pico">${at.icon[p]||''}</span>${p}</span><span class="pts">${at.scores[p]}</span></div>`).join('');
  el.innerHTML=`

    <div class="crown">👑</div>
    <div class="endcard" style="padding-top:20px">
      <div class="endcard__line" style="margin-top:0;font-size:24px">${tie?`It's a tie: ${winners.join(' & ')}`:`${winners[0]} is not all talk`}</div>
      <div class="endcard__sub">${tie?'Dead even.':'Bid it, then delivered it.'}</div>
    </div>
    <div class="standings__h" style="text-align:center">Final standings · rounds won</div>
    <div class="scoreboard">${rows}</div>
    <div class="stack">
      <button class="btn" id="rematch">Rematch</button>
      <button class="btn btn--ghost" id="home">Back to games</button>
    </div>
    <div class="spacer"></div>`;
  celebrateCrown(el);
  el.querySelector('#rematch').onclick=()=>{
    at.players.forEach(p=>at.scores[p]=0);
    at.deck=freshDeck(ATCATS,'st_seen_alltalk',5);
    at.round=0;
    go('at_round',{exit:true});
  };
  el.querySelector('#home').onclick=()=>go('hub');
});

/* =========================================================================

   correct answer is opts[0]; options are shuffled at render.
   Vs. mode: 2 to 6 players, everyone answers the SAME 8 questions in blocks
   of 2, passing the phone between turns. Instant right/wrong stays: the
   screen is hidden during play, and a player who already answered gains
   nothing by announcing the answer to an opponent who has not.
   ========================================================================= */
let tr={};

function triviaLine(s,t){ if(s===t)return "Flawless."; if(s>=t*0.75)return "Sharp."; if(s>=t*0.5)return "Not bad."; return "Room to grow."; }

  const opts=tr.order.map(o=>item.opts[o]);

  el.innerHTML=`
    <div class="eyebrow">Trivia · ${tr.i+1} of ${tr.deck.length}</div>

      list.querySelectorAll('.opt').forEach((x,xi)=>{
        x.disabled=true; x.style.cursor='default';
        if(xi===correctIdx){ x.classList.add('right'); x.insertAdjacentHTML('beforeend',`<span class="tlabel tlabel--ok">${correct?'Correct':'Correct answer'}</span>`); }
        else if(xi===idx){ x.classList.add('wrong'); x.insertAdjacentHTML('beforeend','<span class="tlabel tlabel--no">Incorrect</span>'); }
      });
      if(correct){ const r=b.getBoundingClientRect(); confettiBurst(r.left+r.width/2, r.top+r.height/2); }
      const nb=h(`<button class="btn" id="next" style="margin-top:16px">${tr.i+1<tr.deck.length?'Next':'See score'} ›</button>`);
      nb.onclick=()=>{ tr.i++; tr.answered=false; tr.order=null; go('trivia',{exit:true}); };
      list.appendChild(nb);
    };
    list.appendChild(b);
  });
  const prog=el.querySelector('#prog');
  for(let k=0;k<tr.deck.length;k++){const i=document.createElement('i');if(k<tr.i)i.className='done';else if(k===tr.i)i.className='on';prog.appendChild(i);}
});

/* --- trivia vs. mode --- */
let tv={};
reg('trivia_setup', (el)=>{
  el.innerHTML=`
    <div class="eyebrow">Trivia · setup</div>
    <h1 class="big">Who's playing?</h1>
    <p class="lede">Add everyone playing. 2 to 8 players.</p>
    <div class="players" id="chips"></div>
    <div class="nameadd">
      <input id="nameInput" placeholder="Add a name" autocomplete="off" maxlength="14" />
      <button class="btn sm" id="addBtn" style="padding-left:20px;padding-right:20px">Add</button>
    </div>
    <div class="namehint" id="nameHint"></div>
    <button class="btn" id="startTv" style="margin-top:14px;${tv.players.length<2?'opacity:.4':''}" ${tv.players.length<2?'disabled':''}>Start ›</button>
    <div class="spacer"></div>`;
  const chips=el.querySelector('#chips'), input=el.querySelector('#nameInput');
  if(!tv.icon) tv.icon={};
  if(!tv.iconPool) tv.iconPool=shuffle(HS_ICONS);
  function renderChips(){
    chips.innerHTML='';
    tv.players.forEach((p,idx)=>{
      const c=h(`<span class="namechip"><span class="pico">${tv.icon[p]||''}</span> ${p}<button aria-label="Remove ${p}">×</button></span>`);
      c.querySelector('button').onclick=()=>{const nm=tv.players[idx];tv.players.splice(idx,1);delete tv.icon[nm];renderChips();refreshStart();};
      chips.appendChild(c);
    });
  }
  // Pending typed name counts toward the minimum; Start adds it (see below).
  function refreshStart(){const b=el.querySelector('#startTv');const ok=tv.players.length+(input.value.trim()?1:0)>=2;b.disabled=!ok;b.style.opacity=ok?'1':'.4';}
  const hint=el.querySelector('#nameHint');
  function add(){
    const v=input.value.trim();
    if(!v)return false;
    if(tv.players.length>=8){hint.textContent="That's the max of 8 players. Remove someone first.";return false;}
    if(tv.players.some(p=>p.toLowerCase()===v.toLowerCase())){hint.textContent='Someone already has that name. Add a last initial?';return false;}
    const used=new Set(Object.values(tv.icon));
    tv.icon[v]=tv.iconPool.find(x=>!used.has(x))||HS_ICONS[Object.keys(tv.icon).length%HS_ICONS.length];
    hint.textContent=''; tv.players.push(v);input.value='';input.focus();renderChips();refreshStart();
    return true;
  }
  el.querySelector('#addBtn').onclick=()=>{ add(); };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter')add(); else hint.textContent=''; });
  input.addEventListener('input', refreshStart);
  el.querySelector('#startTv').onclick=()=>{
    // A name left in the box is meant to be a player, not discarded.
    if(input.value.trim() && !add()){ input.focus(); return; }
    if(tv.players.length<2)return;
    logPlay('trivia');
    tv.scores={}; tv.players.forEach(p=>tv.scores[p]=0);
    tv.deck=freshDeck(TRIVIA,'st_seen_trivia',8);
    tv.block=0; tv.pi=0; tv.qInBlock=0; tv.answered=false; tv.order=null;
    go('tv_pass',{exit:true});
  };
});

reg('tv_pass', (el)=>{
  const p=tv.players[tv.pi];
  const q1=tv.block*2+1, q2=Math.min(tv.block*2+2, tv.deck.length);
  const lbl = q2>q1 ? `Questions ${q1} and ${q2}` : `Question ${q1}`;
  // Running standings, decided with the operator: visible on pass screens, sorted,
  // hidden before anyone has answered (a row of zeros says nothing).
  const anyAnswered = tv.block>0 || tv.pi>0;
  const stand = anyAnswered
    ? [...tv.players].sort((a,b)=>tv.scores[b]-tv.scores[a]).map(x=>`${tv.icon[x]} ${x} ${tv.scores[x]}`).join(' · ')
    : '';
  el.innerHTML=`
    <div class="eyebrow">Trivia · ${lbl.toLowerCase()} of ${tv.deck.length}</div>
    <div class="handoff">
      <div class="handoff__pass">Pass the phone to <span class="pico34">📲</span></div>
      <div class="handoff__to">${tv.icon[p]} ${p}</div>
      <div class="handoff__role">Get ready for ${lbl.toLowerCase()}. Everyone answers the same ones, so don't let anyone see the screen.</div>
      ${stand?`<div class="handoff__stand">${stand}</div>`:''}
      <button class="btn" id="ready">Go, ${p} ›</button>
    </div>`;
  el.querySelector('#ready').onclick=()=>go('tv_q',{exit:true});
});

function tvAdvance(){
  tv.answered=false; tv.order=null;
  tv.qInBlock++;
  if(tv.qInBlock<2 && tv.block*2+tv.qInBlock<tv.deck.length){ go('tv_q',{exit:true}); return; }
  tv.qInBlock=0; tv.pi++;
  if(tv.pi<tv.players.length){ go('tv_pass',{exit:true}); return; }
  tv.pi=0; tv.block++;
  if(tv.block*2<tv.deck.length){ go('tv_pass',{exit:true}); return; }
  go('tv_final',{exit:true});
}

reg('tv_q', (el)=>{
  const p=tv.players[tv.pi];
  const qi=tv.block*2+tv.qInBlock;
  const item=TRIVIA[tv.deck[qi]];
  markSeen('st_seen_trivia', item.id);
  if(!tv.order) tv.order=shuffle([0,1,2,3]);
  const opts=tv.order.map(o=>item.opts[o]);
  const correctIdx=tv.order.indexOf(0);
  el.innerHTML=`
    <div class="eyebrow">${tv.icon[p]} ${p} · ${qi+1} of ${tv.deck.length}</div>
    <div class="hsq">${item.q}</div>
    <div class="optlist" id="opts"></div>
    <div class="progress" id="prog" style="margin-top:auto"></div>`;
  const list=el.querySelector('#opts');
  opts.forEach((o,idx)=>{
    const b=h(`<button class="opt">${o}</button>`);
    b.onclick=()=>{
      if(tv.answered)return; tv.answered=true;
      const correct = idx===correctIdx;
      if(correct) tv.scores[p]++;
      list.querySelectorAll('.opt').forEach((x,xi)=>{
        x.disabled=true; x.style.cursor='default';
        if(xi===correctIdx){ x.classList.add('right'); x.insertAdjacentHTML('beforeend',`<span class="tlabel tlabel--ok">${correct?'Correct':'Correct answer'}</span>`); }
        else if(xi===idx){ x.classList.add('wrong'); x.insertAdjacentHTML('beforeend','<span class="tlabel tlabel--no">Incorrect</span>'); }
      });
      if(correct){ const r=b.getBoundingClientRect(); confettiBurst(r.left+r.width/2, r.top+r.height/2); }
      const moreInTurn = tv.qInBlock===0 && qi+1<tv.deck.length;
      const gameOver = !moreInTurn && tv.pi===tv.players.length-1 && (tv.block+1)*2>=tv.deck.length;
      const nb=h(`<button class="btn" id="next" style="margin-top:16px">${moreInTurn?'Next':(gameOver?'See who wins':'Pass the phone')} ›</button>`);
      nb.onclick=tvAdvance;
      list.appendChild(nb);
    };
    list.appendChild(b);
  });
  const prog=el.querySelector('#prog');
  for(let k=0;k<tv.deck.length;k++){const i=document.createElement('i');if(k<qi)i.className='done';else if(k===qi)i.className='on';prog.appendChild(i);}
});

reg('tv_final', (el)=>{
  const sorted=[...tv.players].sort((a,b)=>tv.scores[b]-tv.scores[a]);
  const top=tv.scores[sorted[0]];
  const winners=sorted.filter(p=>tv.scores[p]===top);
  const tie=winners.length>1;
  const rows=sorted.map((p,i)=>`<div class="scorerow ${tv.scores[p]===top?'lead':''}"><span class="who"><span class="rank">${i+1}</span><span class="pico">${tv.icon[p]||''}</span>${p}</span><span class="pts">${tv.scores[p]}</span></div>`).join('');
  el.innerHTML=`
    <div class="spacer"></div>
    <div class="crown">👑</div>
    <div class="endcard" style="padding-top:20px">
      <div class="endcard__line" style="margin-top:0;font-size:24px">${tie?`It's a tie: ${winners.join(' & ')}`:`${winners[0]} knows their stuff`}</div>
      <div class="endcard__sub">${tie?'Dead even.':'Same questions, better answers.'}</div>
    </div>
    <div class="standings__h" style="text-align:center">Final score · out of ${tv.deck.length}</div>
    <div class="scoreboard">${rows}</div>
    <div class="stack">
      <button class="btn" id="rematch">Rematch</button>
      <button class="btn btn--ghost" id="home">Back to games</button>
    </div>
    <div class="spacer"></div>`;
  celebrateCrown(el);
  el.querySelector('#rematch').onclick=()=>{
    tv.players.forEach(p=>tv.scores[p]=0);
    tv.deck=freshDeck(TRIVIA,'st_seen_trivia',8);
    tv.block=0; tv.pi=0; tv.qInBlock=0; tv.answered=false; tv.order=null;
    go('tv_pass',{exit:true});
  };
  el.querySelector('#home').onclick=()=>go('hub');
});

/* ---------- DATA LOADING (live from Supabase) ---------- */
async function loadVenues(){
  // select * so this works both before and after 14_owner_dashboard.sql adds
  // later installs added columns to the view.
  const { data, error } = await db.from('public_venues').select('*');
  if(error) throw error;
  const map={};
  data.forEach(v=>{ map[v.id]={ name:v.name, logo:v.logo, accent:v.accent, review:v.google_review_link, games:v.games || null, customQuestions:!!v.custom_questions, headerBg:v.header_bg || null, customOnly:v.custom_only || [], darkMode:!!v.dark_mode, cards:Array.isArray(v.cards) ? v.cards : [], gamesEnabled:v.games_enabled !== false, formCustom:!!v.form_custom, demo:v.demo === true }; });
  return map;
}
async function loadContent(){
  // RLS already limits every table to its ACTIVE rows, so no status filter here.
  // select * on purpose (same trick as public_venues): the queries work both
  // before and after 19_game_library.sql adds venue_id to these tables.
  const [t,hsq,tv,w,wy,f,ac,fm] = await Promise.all([
    db.from('gts_questions').select('*').order('id'),
    db.from('wkw_questions').select('*').order('id'),
    db.from('trivia_questions').select('*').order('id'),
    db.from('wordy_words').select('*').order('word'),
    db.from('wiy_words').select('*').order('id'),
    db.from('fortunes').select('*').order('id'),
    db.from('at_categories').select('*').order('id'),
    db.from('feedback_forms').select('*')
  ]);
  // wiy_words is deliberately NOT in the throw loop: before 16_who_invited_you.sql
  // runs the table does not exist, and the game card simply stays hidden.
  for(const r of [t,hsq,tv,w]) if(r.error) throw r.error;
  // vid = the row's venue_id (null/undefined = shared pool). Kept on every
  // item; filterContentForVenue() applies it once the venue is resolved.
  TOT    = t.data.map(r=>({ id:r.id, a:r.option_a, b:r.option_b, count_a:r.count_a, count_b:r.count_b, vid:r.venue_id||null }));
  HS     = hsq.data.map(r=>({ id:r.id, q:r.prompt, opts:[r.option_a,r.option_b,r.option_c,r.option_d], vid:r.venue_id||null }));
  TRIVIA = tv.data.map(r=>({ id:r.id, q:r.question, opts:[r.correct_answer, r.wrong_1, r.wrong_2, r.wrong_3], vid:r.venue_id||null }));
  WORDS  = w.data.map(r=>({ id:r.word, vid:r.venue_id||null }));   // word IS the permanent id
  WIY    = (wy.error || !wy.data) ? [] : wy.data.map(r=>({ id:r.id, cat:r.category, word:r.word, vid:r.venue_id||null }));
  // fortunes is non-fatal like wiy: before 20_fortune_teller.sql runs the
  // table does not exist, and the game card simply stays hidden.
  FORTUNES = (f.error || !f.data) ? [] : f.data.map(r=>({ id:r.id, text:r.text, vid:r.venue_id||null }));
  ATCATS   = (ac.error || !ac.data) ? [] : ac.data.map(r=>({ id:r.id, cat:r.category, vid:r.venue_id||null }));
  // non-fatal like wiy: before 35_feedback_forms.sql the table does not
  // exist and the suggestion box simply shows the stock form
  FORMS = {};
  if(!fm.error && fm.data) fm.data.forEach(r=>{ FORMS[r.id] = r; });
}

/* Runs once at boot, after the venue is resolved. Shared rows (no vid) stay
   for everyone; a venue's custom rows stay only at that venue AND only while
   its paid custom_questions flag is on, so a lapsed venue's rows go dormant
   without deleting anything and no venue ever sees another venue's rows. */
/* One full round per game, as dealt above. 28_custom_only_retire.sql keeps
   the SAME numbers in content_floor(); change them together. */
const MIN_CUSTOM_ONLY = { guess_the_split:5, who_knows_who:12, trivia:8, wordy:5, who_invited_you:5, fortune_teller:3, all_talk:5 };
function filterContentForVenue(){
  const v = venue();
  const keep = it => !it.vid || (it.vid === state.venue && !!(v && v.customQuestions));
  TOT = TOT.filter(keep); HS = HS.filter(keep); TRIVIA = TRIVIA.filter(keep);
  WORDS = WORDS.filter(keep); WIY = WIY.filter(keep); FORTUNES = FORTUNES.filter(keep);
  ATCATS = ATCATS.filter(keep);
  // Custom-only, per game (paid tier): deal ONLY this venue's rows where it
  // asked for that AND its pool clears one full round. Below the floor it
  // FAILS OPEN to the normal custom-first blend, so a thin pool can never
  // shorten or break a game at the table.
  if(v && v.customQuestions && Array.isArray(v.customOnly) && v.customOnly.length){
    const only = (list, g) => {
      if(!v.customOnly.includes(g)) return list;
      const own = list.filter(it => it.vid);
      return own.length >= MIN_CUSTOM_ONLY[g] ? own : list;
    };
    TOT = only(TOT, 'guess_the_split'); HS = only(HS, 'who_knows_who'); TRIVIA = only(TRIVIA, 'trivia');
    WORDS = only(WORDS, 'wordy'); WIY = only(WIY, 'who_invited_you');
    FORTUNES = only(FORTUNES, 'fortune_teller'); ATCATS = only(ATCATS, 'all_talk');
  }
}

/* a bare centered message for loading / unavailable / offline states */
function showMessage(title, body){
  backBtn.style.display='none'; exitBtn.style.display='none';
  stage.innerHTML = `<div class="screen is-active"><div class="center-col">${title?`<h1 class="big">${title}</h1>`:''}${body?`<p class="lede" style="max-width:32ch">${body}</p>`:''}</div></div>`;
}

/* ---------- BOOT ---------- */
const params = new URLSearchParams(location.search);
const vParam = params.get('v');
const goParam = params.get('go');                        // games | box | (none)
state.entry = goParam === 'games' ? 'games'
            : goParam === 'box'   ? 'suggest'
            :                       'landing';            // no &go -> single-QR chooser
if(vParam) state.venue = vParam;

async function boot(){
  showMessage('', 'Loading…');
  if(vParam) applyCachedBranding(vParam);   // instant accent + logo on repeat visits
  const contentP = loadContent();           // runs in PARALLEL with the venues query
  contentP.catch(()=>{});                   // real handling happens at the await below
  try {
    VENUES = await loadVenues();
  } catch(e){
    showMessage('One sec', "We couldn't reach the server. Check your connection and try again.");
    return;
  }
  // Resolve which venue to show.
  if(vParam){
    if(!VENUES[vParam]){ showMessage('Not available', "This table isn't set up yet. If you're the owner, check the venue's status in Supabase."); return; }
    state.venue = vParam;
  } else if(!VENUES[state.venue]){
    const first = Object.keys(VENUES)[0];
    if(!first){ showMessage('Not available', 'No venues are live yet.'); return; }
    state.venue = first;   // only if the demo row itself is missing: first venue
  }
  applyBranding();          // fresh branding (and the logo request) start here,
  saveBrandCache(state.venue);   // not after the content finishes
  try {
    await contentP;
  } catch(e){
    showMessage('One sec', "We couldn't reach the server. Check your connection and try again.");
    return;
  }
  filterContentForVenue();   // custom rows: this venue's only, and only if paid
  startEntry();
}
boot();
