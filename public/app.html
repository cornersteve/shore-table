reg('ch_setup__back', ()=> go('ch_intro'));

reg('ch_play', (el)=>{
  const game = ch.game;
  if(!game){ go('ch_intro'); return; }
  // full bleed regardless of breakpoint: this screen drops its own padding
  // instead of fighting the responsive .screen padding with margins
  el.style.padding = '0';
  el.innerHTML = `
    <div class="ch-stage" id="chStage">
      <canvas id="chCv"></canvas>
      <div class="ch-bar" id="chBar"></div>
      <div class="ch-hint" id="chHint"></div>
      <div class="ch-over" id="chOver"><div class="ch-card">
        <h3 id="chOT"></h3><div class="n" id="chON"></div><div class="l" id="chOL"></div>
        <div class="v" id="chOV"></div>
        <button class="btn" id="chOGo"></button>
        <button class="btn btn--ghost" id="chOMenu">Back to cornhole menu</button>
      </div></div>
    </div>`;
  const q = s => el.querySelector(s);
  const cv = q('#chCv'), ctx = cv.getContext('2d'), hintEl = q('#chHint');
  const acc = getComputedStyle(appEl).getPropertyValue('--accent').trim() || '#3a6ea5';
  const C = {
    court:'#26331e', line:'#3a4a2c', wood:'#b98a4e', wood2:'#a97c42', rail:'#8a6236',
    skirt:'#6e4d2a', holeC:'#0d0b09', night:'#14120f', cream:'#ece7dd', dim:'#a7a196',
    red:'#a5402f', red2:'#8d3527', redHi:'#e08a76', blue:'#3f5f8a', blue2:'#33507a', blueHi:'#8fb2e0',
    target:'#8d2b1e', acc, accHi: chMix(acc, '#ffffff', 0.5),
  };
  const S = { POWER:0, AIM:1, FLY:2, SETTLE:3, IDLE:9 };
  let st = S.IDLE, bag = null;
  let targets = [], wind = 0;
  const other = t => t === 'red' ? 'blue' : 'red';
  const teamOf = ix => ix % 2 === 0 ? game.starter : other(game.starter);
  // Like real 4-player cornhole: one player per team throws the WHOLE round
  // (red 1 vs blue 1 in round 1, the 2s in round 2, ...), so the phone only
  // passes between two people within a round. Uneven teams just repeat.
  const roundPlayer = t => game[t].players[(game.round - 1) % game[t].players.length];
  const thrower = ()=> roundPlayer(teamOf(game.throwIx));

  /* FIXED DESIGN SPACE (the operator, Aug 2026: the court was stretching with
     the viewport and scrunched on his iPhone 17). All geometry lives in
     a constant 390x760 world, uniformly scaled and centered into
     whatever canvas the phone provides - proportions are identical on
     every device, and the night background letterboxes the rest. */
  const DW = 390, DH = 760;
  let W = 0, H = 0, SCL = 1, OX = 0, OY = 0;
  const BAG_R = 8.5, LIFT_FAR = 16, LIFT_NEAR = 5;
  // Width-only enlargement (the operator: board read small on the phone). Depth
  // (farY/nearY) is deliberately untouched: power->distance maps to y, so
  // changing depth would move the whole power sweet spot. Width only makes
  // the board bigger on screen and slightly more forgiving off-center.
  const board = { farY: DH*0.23, farW: DW*0.405, nearY: DH*0.50, nearW: DW*0.62 };
  const hole  = { x: DW/2, y: DH*0.285, r: DW*0.042 };
  const startP = { x: DW/2, y: DH - 84 };
  function size(){
    const DPR = Math.min(2, devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    if(!W || !H) return;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    SCL = Math.min(W / DW, H / DH);
    OX = (W - DW * SCL) / 2;
    OY = (H - DH * SCL) / 2;
  }
  const halfAt = y => { const u = (y-board.farY)/(board.nearY-board.farY); return (board.farW + (board.nearW-board.farW)*u)/2; };
  const logoBoxAt = ()=>{ const bw = 104, bh = 72; return { x1: DW/2-bw/2, y1: DH*0.375, x2: DW/2+bw/2, y2: DH*0.375 + bh, bw, bh }; };
  function defaultTargets(){
    const ty = board.farY + (board.nearY-board.farY)*0.10;
    const half = halfAt(ty)*0.74, tr = hole.r*0.78;
    targets = [ {x: DW/2-half, y: ty, r: tr}, {x: DW/2+half, y: ty, r: tr} ];
  }
  function randomTargets(){
    const tr = hole.r*0.78, lb = logoBoxAt(), spots = [];
    let guard = 0;
    while(spots.length < 2 && guard++ < 300){
      const u = 0.08 + Math.random()*0.72;
      const y = board.farY + (board.nearY-board.farY)*u;
      const x = DW/2 + (Math.random()*2-1)*halfAt(y)*0.72;
      const clearHole = Math.hypot(x-hole.x, (y-hole.y)/0.62) > (hole.r+tr)*1.5;
      const spaced = spots.every(s => Math.hypot(x-s.x, y-s.y) > tr*3);
      const offLogo = !(x > lb.x1-tr && x < lb.x2+tr && y > lb.y1-tr && y < lb.y2+tr);
      if(clearHole && spaced && offLogo) spots.push({x, y, r: tr});
    }
    if(spots.length === 2) targets = spots;
  }
  function rollWind(){ wind = CH_DIFF[ch.diff].wind ? (Math.random()*2-1)*CH_WIND_MAX : 0; }
  function driftWind(){ if(!CH_DIFF[ch.diff].wind){ wind = 0; return; } wind = Math.max(-CH_WIND_MAX, Math.min(CH_WIND_MAX, wind + (Math.random()*2-1)*CH_WIND_MAX*0.25)); }

  function bar(){
    const b = q('#chBar');
    if(game.mode === 'solo'){
      let best = 0; try{ best = +(localStorage.getItem('st_ch_best_' + ch.diff) || 0); }catch(e){}
      b.innerHTML = `<span class="rd">Practice · ${({easy:'Easy',normal:'Normal',hard:'Hard'})[ch.diff]}</span><button class="ch-rst" id="chRst">Restart</button><span class="sc">${best ? `<span class="dsh">best ${best}</span>` : ''}<span style="color:#dcae77">${game.score}</span></span>`;
      return;
    }
    const rp = game.roundPts;
    b.innerHTML = `<span class="rd">Round ${game.round}</span>
      <span class="sc"><span class="cr">${game.red.score}</span><span class="dsh">—</span><span class="cb">${game.blue.score}</span></span>
      <span class="rd">to ${game.target}</span>
      ${game.scoring === 'classic' ? `<span class="rt">this round&nbsp; <b class="cr">${rp.red}</b> — <b class="cb">${rp.blue}</b></span>` : ''}`;
  }
  function nextBag(){
    st = S.POWER;
    bag = { t0: performance.now(), power:0, angle:0, shake:0,
            team: game.mode === 'teams' ? teamOf(game.throwIx) : 'red' };
    hintEl.textContent = 'Tap anywhere to set power';
    bar();
  }
  const pp = (ms, period)=>{ const u = (ms % period)/period; return u < .5 ? u*2 : 2-u*2; };
  cv.addEventListener('pointerdown', ()=>{
    const now = performance.now();
    if(st === S.POWER){
      bag.power = pp(now - bag.t0, CH_DIFF[ch.diff].power);
      bag.t0 = now; st = S.AIM;
      hintEl.textContent = 'Tap anywhere to set aim';
    } else if(st === S.AIM){
      bag.angle = (pp(now - bag.t0, CH_DIFF[ch.diff].aim)*2 - 1)*0.55;
      launch(now);
    } else if(st === S.SETTLE){
      advance();
    }
  });

  function launch(now){
    st = S.FLY;
    hintEl.textContent = '...';
    // Piecewise power curve (operator decision): identical through 72% — the
    // whole front board and the learned ~71% hole shot keep their numbers —
    // then 0.74x gain above it, stretching the deep-board strip from a 28ms
    // tap window to ~38ms. 100% still sails well off the back.
    const eff = bag.power <= 0.72 ? bag.power : 0.72 + (bag.power - 0.72)*0.74;
    const R = eff * 1.12 * (startP.y - DH*0.13);
    const yLand = startP.y - R*Math.cos(bag.angle);
    const windPx = wind * R;
    const xLand = startP.x + Math.sin(bag.angle)*R*0.85 + windPx;
    const res = resolve(xLand, yLand);
    let to = { x: xLand, y: yLand };
    if(res.kind === 'hole' || res.kind === 'swish') to = { x: hole.x, y: hole.y };
    else if(res.kind === 'off') to = slideOff(xLand, yLand);
    bag.fly = { t0: now, dur: 820, from: {...startP}, to, res, windPx };
  }
  function slideOff(x, y){
    const dx = x - DW/2;
    // Side miss at board depth: the bag would overlap the deck edge, so it
    // slides just clear of it. ONLY at board depth — the old y-window also
    // caught bags overshooting the BACK near center and flung them to a side
    // edge, which read as the aim tap going wildly crooked at ~75-79% power.
    if(y >= board.farY && y <= board.nearY + BAG_R){
      const half = halfAt(Math.min(board.nearY, y));
      if(Math.abs(dx) < half + BAG_R*2){
        const dir = dx >= 0 ? 1 : -1;
        const u = (y-board.farY)/(board.nearY-board.farY);
        const lift = LIFT_FAR + (LIFT_NEAR-LIFT_FAR)*Math.max(0, Math.min(1, u));
        return { x: DW/2 + dir*(half + BAG_R*2 + 4), y: y + lift + 4 };
      }
    } else if(y < board.farY && y >= board.farY - BAG_R*2 && Math.abs(dx) < halfAt(board.farY) + BAG_R){
      // overshot the back edge: settle just beyond it, straight where thrown
      return { x, y: board.farY - BAG_R*2 - 2 };
    }
    return { x, y };
  }
  function overlap(d, R, r){
    if(d >= R + r) return 0;
    if(d <= Math.abs(R - r)) return Math.PI * Math.min(R, r) ** 2;
    return r*r*Math.acos((d*d + r*r - R*R)/(2*d*r))
         + R*R*Math.acos((d*d + R*R - r*r)/(2*d*R))
         - 0.5*Math.sqrt((-d+r+R)*(d+r-R)*(d-r+R)*(d+r+R));
  }
  function resolve(x, y){
    const ny = hole.y + (y - hole.y)/0.62;
    const dH = Math.hypot(x - hole.x, ny - hole.y);
    if(dH + BAG_R <= hole.r) return { kind:'swish', pts:3 };
    if(dH < hole.r)          return { kind:'hole',  pts:3 };
    const area = Math.PI*BAG_R*BAG_R;
    for(const t of targets){
      const f = overlap(Math.hypot(x-t.x, y-t.y), t.r, BAG_R)/area;
      if(f >= 0.75) return { kind:'bull', pts:5 };
      if(f > 0)     return { kind:'close', pts: onBoard(x,y) ? 1 : 0 };
    }
    if(onBoard(x, y)) return { kind:'board', pts:1 };
    return { kind:'off', pts:0 };
  }
  // DW/2, not W/2: physics runs in design space. W/2 only matched on
  // 390px-wide phones by coincidence; on an SE or Pro Max it shifted the
  // board's collision center sideways off the drawn board.
  const onBoard = (x, y)=> y >= board.farY && y <= board.nearY && Math.abs(x - DW/2) < halfAt(y);

  function landed(){
    st = S.SETTLE;
    const r = bag.fly.res;
    if(game.mode === 'teams'){
      game.roundPts[bag.team] += r.pts;
      // rally: the board is live. classic: the board holds until the round
      // settles (only the net difference scores); the round tally shows
      // the running exchange instead.
      if(game.scoring === 'rally') game[bag.team].score += r.pts;
    }
    else game.score += r.pts;
    bar();
    const texts = { swish:'SWISH! NOTHING BUT HOLE +3', hole:'+3 IN THE HOLE', bull:'+5 BULLSEYE',
      close: r.pts ? 'SO CLOSE! ON THE BOARD +1' : 'SO CLOSE! JUST OFF',
      board:'+1 ON THE BOARD', off:'OFF - NO POINTS' };
    bag.callout = { text: texts[r.kind], t0: performance.now(), good: r.pts > 0 };
    if(r.kind !== 'hole' && r.kind !== 'swish') game.landed.push({ x: bag.fly.to.x, y: bag.fly.to.y, team: bag.team });
    if(navigator.vibrate) try{ navigator.vibrate(r.pts >= 3 ? [30,40,60] : 20); }catch(e){}
    if(game.mode === 'solo' && game.bagsLeft === 1){
      // last bag of the set: the summary card comes straight up
      hintEl.textContent = '';
      advance();
    } else {
      hintEl.textContent = 'Tap for the next bag';
    }
  }
  function advance(){
    if(bag && bag.spent) return;   // a tap and the solo auto-show timer can both land here
    if(bag) bag.spent = true;
    if(game.mode === 'solo'){
      game.bagsLeft--;
      if(game.bagsLeft > 0){ nextBag(); return; }
      const s = game.score;
      const diffName = ({easy:'Easy',normal:'Normal',hard:'Hard'})[ch.diff];
      // local, per-device, per-difficulty best (nothing leaves the phone)
      const key = 'st_ch_best_' + ch.diff;
      let prev = 0; try{ prev = +(localStorage.getItem(key) || 0); }catch(e){}
      const isBest = s > prev;
      if(isBest) try{ localStorage.setItem(key, String(s)); }catch(e){}
      const quip =
        s >= 12 ? 'Cornhole royalty. The table buys your next round.' :
        s >= 7  ? 'Solid arm. One more set?' :
        s >= 3  ? 'Warming up. The hole is up top.' : 'The grass thanks you for the gifts.';
      const line = isBest && prev > 0 ? 'New ' + diffName + ' best on this phone. Old best: ' + prev + '.'
                 : isBest            ? quip + ' That is your ' + diffName + ' score to beat.'
                 : prev > 0          ? quip + ' Best on this phone: ' + prev + '.'
                 : quip;
      card(isBest && prev > 0 ? 'New high score!' : 'Nice set', s, 'points · 4 bags · ' + diffName.toLowerCase(),
        line,
        // mutate in place: every closure here holds `game`, so swapping in a
        // fresh ch.game object would leave them all pointing at the dead one
        'Throw 4 more', ()=>{ game.bagsLeft = 4; game.score = 0; restart(); });
      return;
    }
    game.throwIx++;
    if(game.throwIx < 8){ nextBag(); return; }
    endRound();
  }
  function endRound(){
    const rp = game.roundPts;
    let line = '';
    if(game.scoring === 'classic'){
      if(rp.red > rp.blue){ game.red.score += rp.red - rp.blue; line = `Red take the round ${rp.red}-${rp.blue}: +${rp.red - rp.blue}.`; }
      else if(rp.blue > rp.red){ game.blue.score += rp.blue - rp.red; line = `Blue take the round ${rp.blue}-${rp.red}: +${rp.blue - rp.red}.`; }
      else line = `Round washed at ${rp.red}-${rp.blue}. Nobody scores.`;
    }
    bar();
    const r = game.red.score, b = game.blue.score, t = game.target;
    if(game.scoring === 'rally'){ if(r !== b) game.starter = r > b ? 'red' : 'blue'; }
    else { if(rp.red !== rp.blue) game.starter = rp.red > rp.blue ? 'red' : 'blue'; }
    if(r >= t || b >= t){
      if(r === b){
        card('Tied at ' + r, r + ':' + b, 'one more round',
          'Dead even over the line. Sudden-death round: highest total takes it.',
          'Play the tiebreaker', nextRound);
        return;
      }
      const wTeam = r > b ? 'red' : 'blue';
      q('#chOT').innerHTML = `<span class="ch-tag ${wTeam}">${wTeam} wins</span>`;
      q('#chON').textContent = r + ':' + b;
      q('#chOL').textContent = 'final · ' + game.round + (game.round === 1 ? ' round' : ' rounds');
      q('#chOV').textContent = game[wTeam].players.join(' + ') + ' take the table.';
      q('#chOGo').textContent = 'Rematch';
      q('#chOGo').onclick = ()=>{
        // same in-place rule as the solo restart: never reassign ch.game
        game.red.score = 0; game.blue.score = 0;
        game.starter = 'red'; game.throwIx = 0; game.round = 1;
        game.roundPts = { red: 0, blue: 0 };
        q('#chOver').classList.remove('show');
        restart();
      };
      q('#chOver').classList.add('show');
      st = S.IDLE;
      return;
    }
    // who throws next round (the round counter bumps inside nextRound)
    const nx = tm => game[tm].players[game.round % game[tm].players.length];
    const up = (game.red.players.length > 1 || game.blue.players.length > 1)
      ? ' Up next: ' + nx(game.starter) + ' vs ' + nx(other(game.starter)) + '.'
      : '';
    card('Round ' + game.round + ' done', r + ':' + b, 'red : blue · first over ' + t,
      (line ? line + ' ' : '') + (game.starter === 'red' ? 'Red' : 'Blue') + ' throw first.' + up,
      'Throw round ' + (game.round + 1), nextRound);
  }
  function nextRound(){
    q('#chOver').classList.remove('show');
    game.round++; game.throwIx = 0;
    game.roundPts = { red:0, blue:0 };
    game.landed = [];
    driftWind();
    if(CH_DIFF[ch.diff].randomTargets) randomTargets();
    nextBag();
  }
  function card(title, n, l, v, goText, goFn){
    st = S.IDLE;
    q('#chOT').textContent = title;
    q('#chON').textContent = n;
    q('#chOL').textContent = l;
    q('#chOV').textContent = v;
    q('#chOGo').textContent = goText;
    q('#chOGo').onclick = ()=>{ q('#chOver').classList.remove('show'); goFn(); };
    q('#chOver').classList.add('show');
  }
  function restart(){
    q('#chOver').classList.remove('show');
    size(); rollWind();
    if(CH_DIFF[ch.diff].randomTargets) randomTargets();
    game.landed = [];
    nextBag();
  }
  q('#chOMenu').onclick = ()=> go('ch_intro',{exit:true});
  // one-click practice restart, live even mid-throw (the bar re-renders, so
  // delegate from its container; same in-place reset as "Throw 4 more")
  q('#chBar').addEventListener('click', (e)=>{
    if(e.target.id === 'chRst' && game.mode === 'solo'){
      game.bagsLeft = 4; game.score = 0;
      q('#chOver').classList.remove('show');
      restart();
    }
  });

  /* ---- render (stops itself when this screen's canvas leaves the DOM) ---- */
  const ease = u => 1 - Math.pow(1 - u, 3);
  function draw(now){
    if(!cv.isConnected){ ro.disconnect(); return; }
    requestAnimationFrame(draw);
    if(!W || !SCL) return;
    let sx = 0;
    if(bag && bag.shake > 0){ sx = (Math.random()-.5)*bag.shake; bag.shake *= .82; }
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = C.night; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX + sx*SCL, OY);
    ctx.scale(SCL, SCL);
    // the court, in design space; it bleeds past the design box so
    // letterboxed phones still read lawn at the edges
    ctx.fillStyle = C.court;
    ctx.beginPath();
    ctx.moveTo(DW*0.18, 96); ctx.lineTo(DW*0.82, 96);
    ctx.lineTo(DW*1.30, DH+60); ctx.lineTo(-DW*0.30, DH+60);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = 2;
    for(const u of [0.35, 0.62]){
      const y = 96 + (DH - 96)*u;
      const spread = 0.18 - 0.28*u;
      ctx.beginPath(); ctx.moveTo(DW*spread, y); ctx.lineTo(DW*(1-spread), y); ctx.stroke();
    }
    drawBoard();
    for(const b of game.landed) drawBag(b.x, b.y, 0.45, 4, b.team);
    if(st === S.POWER || st === S.AIM){
      turnBanner(); windRow();
      if(st === S.POWER) powerMeter(now); else aimArrow(now);
      drawBag(startP.x, startP.y, 1, 0, bag.team);
    }
    if(st === S.FLY){ windRow(); flight(now); }
    if(st === S.SETTLE) settled(now);
    ctx.restore();
  }
  function drawBoard(){
    const cx = DW/2, fh = board.farW/2, nh = board.nearW/2;
    ctx.fillStyle = 'rgba(0,0,0,.42)';
    quad(cx-fh-4, board.farY+LIFT_FAR, cx+fh+4, board.farY+LIFT_FAR, cx+nh+8, board.nearY+LIFT_NEAR+8, cx-nh-8, board.nearY+LIFT_NEAR+8);
    ctx.fillStyle = C.skirt;
    quad(cx-fh, board.farY, cx-fh, board.farY+LIFT_FAR, cx-nh, board.nearY+LIFT_NEAR, cx-nh, board.nearY);
    quad(cx+fh, board.farY, cx+fh, board.farY+LIFT_FAR, cx+nh, board.nearY+LIFT_NEAR, cx+nh, board.nearY);
    ctx.fillStyle = C.rail;
    quad(cx-nh, board.nearY, cx+nh, board.nearY, cx+nh, board.nearY+LIFT_NEAR, cx-nh, board.nearY+LIFT_NEAR);
    const face = [[cx-fh, board.farY],[cx+fh, board.farY],[cx+nh, board.nearY],[cx-nh, board.nearY]];
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(...face[0]); ctx.lineTo(...face[1]); ctx.lineTo(...face[2]); ctx.lineTo(...face[3]);
    ctx.closePath(); ctx.clip();
    ctx.fillStyle = C.wood; ctx.fillRect(cx-nh, board.farY, board.nearW, board.nearY-board.farY);
    ctx.fillStyle = C.wood2;
    for(let i = -3; i <= 3; i += 2){
      const wT = fh*2/7, wB = nh*2/7;
      quad(cx+i*wT-wT/2, board.farY, cx+i*wT+wT/2, board.farY, cx+i*wB+wB/2, board.nearY, cx+i*wB-wB/2, board.nearY);
    }
    for(const t of targets){
      ctx.fillStyle = C.target;
      ctx.beginPath(); ctx.ellipse(t.x, t.y, t.r, t.r*0.72, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(236,231,221,.75)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(t.x, t.y, t.r*0.62, t.r*0.72*0.62, 0, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(236,231,221,.9)';
      // 9px: the ring is a flattened ellipse (ry ~5.7), so anything taller
      // than ~8px of glyph clips it top and bottom
      ctx.font = '700 9px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('5', t.x, t.y+0.5);
      ctx.textBaseline = 'alphabetic';
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(20,15,8,.55)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(...face[0]); ctx.lineTo(...face[1]); ctx.lineTo(...face[2]); ctx.lineTo(...face[3]);
    ctx.closePath(); ctx.stroke();
    const lb = logoBoxAt();
    if(ch.logoImg){
      ctx.save(); ctx.globalAlpha = 0.96;
      // contain-fit: never stretch the logo to the box's shape
      const iw = ch.logoImg.naturalWidth || 1, ih = ch.logoImg.naturalHeight || 1;
      const fit = Math.min(lb.bw/iw, lb.bh/ih);
      ctx.drawImage(ch.logoImg, lb.x1 + (lb.bw - iw*fit)/2, lb.y1 + (lb.bh - ih*fit)/2, iw*fit, ih*fit);
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(236,231,221,.85)';
      ctx.font = '700 15px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center';
      ctx.fillText((venue().logo || venue().name).toUpperCase().slice(0, 18), DW/2, lb.y1 + lb.bh*0.5 + 5);
    }
    ctx.fillStyle = C.holeC;
    ctx.beginPath(); ctx.ellipse(hole.x, hole.y, hole.r, hole.r*0.62, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(hole.x, hole.y, hole.r, hole.r*0.62, 0, Math.PI, Math.PI*2); ctx.stroke();
  }
  function quad(x1,y1,x2,y2,x3,y3,x4,y4){
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
    ctx.closePath(); ctx.fill();
  }
  function turnBanner(){
    if(game.mode !== 'teams') return;
    ctx.fillStyle = bag.team === 'red' ? C.redHi : C.blueHi;
    ctx.font = '700 24px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
    ctx.textAlign = 'center';
    ctx.fillText((thrower() + "'S TURN").toUpperCase(), DW/2, DH*0.585);
  }
  function windRow(){
    if(!CH_DIFF[ch.diff].wind) return;
    const speed = Math.abs(wind)/CH_WIND_MAX, mph = Math.round(speed*12), dir = wind >= 0 ? 1 : -1;
    const y = DH*0.645, cxx = DW/2;
    ctx.fillStyle = C.cream;
    ctx.font = '700 12px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
    ctx.textAlign = 'center';
    ctx.fillText('WIND ' + mph + ' MPH', cxx, y);
    const len = 16 + speed*30, ay = y + 13;
    ctx.strokeStyle = C.accHi; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cxx - dir*len/2, ay); ctx.lineTo(cxx + dir*len/2, ay); ctx.stroke();
    ctx.fillStyle = C.accHi;
    ctx.beginPath();
    ctx.moveTo(cxx + dir*(len/2+8), ay);
    ctx.lineTo(cxx + dir*(len/2-2), ay-5);
    ctx.lineTo(cxx + dir*(len/2-2), ay+5);
    ctx.closePath(); ctx.fill();
  }
  function powerMeter(now){
    const u = pp(now - bag.t0, CH_DIFF[ch.diff].power);
    const mw = 260, mh = 14, x = DW/2 - mw/2, y = startP.y - 58;
    ctx.fillStyle = 'rgba(255,255,255,.12)'; rrc(x, y, mw, mh, 7); ctx.fill();
    ctx.fillStyle = C.acc; rrc(x, y, mw*u, mh, 7); ctx.fill();
    // no "safe zone" box: it lied (high end overshoots the board on a straight
    // shot). Quarter ticks + a live % instead; players learn their number.
    meterTicks(x, y, mw, mh);
    pctLabel(u, x + mw + 9, y + mh - 3, 1);
    meterLabel('POWER', DW/2, y-11);
  }
  function meterTicks(x, y, mw, mh){
    ctx.fillStyle = 'rgba(236,231,221,.4)';
    for(const f of [0.25, 0.5, 0.75]) ctx.fillRect(x + mw*f - 1, y + 2, 2, mh - 4);
  }
  function pctLabel(u, x, y, alpha){
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = C.cream;
    ctx.font = '700 12px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
    ctx.textAlign = 'left';
    ctx.fillText(Math.round(u*100) + '%', x, y);
    ctx.restore();
  }
  function aimArrow(now){
    const a = (pp(now - bag.t0, CH_DIFF[ch.diff].aim)*2 - 1)*0.55;
    const len = 150;
    ctx.save();
    ctx.translate(startP.x, startP.y - 26);
    ctx.rotate(a);
    ctx.strokeStyle = C.acc; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke();
    ctx.fillStyle = C.acc;
    ctx.beginPath(); ctx.moveTo(0, -len-14); ctx.lineTo(-9, -len+2); ctx.lineTo(9, -len+2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    const mw = 260, mx = DW/2 - mw/2, my = startP.y - 58;
    ctx.fillStyle = 'rgba(255,255,255,.12)'; rrc(mx, my, mw, 14, 7); ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = C.acc; rrc(mx, my, mw*bag.power, 14, 7); ctx.fill();
    ctx.globalAlpha = 1;
    meterTicks(mx, my, mw, 14);
    pctLabel(bag.power, mx + mw + 9, my + 11, 0.55);
    meterLabel('AIM', DW/2, startP.y - 69);
  }
  function meterLabel(t, x, y){
    ctx.fillStyle = C.cream;
    ctx.font = '700 11px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
    ctx.textAlign = 'center';
    ctx.fillText(t.split('').join('  '), x, y);
  }
  function flight(now){
    const f = bag.fly;
    const u = Math.min(1, (now - f.t0)/f.dur), e = ease(u);
    const wp = f.windPx || 0;
    const x = f.from.x + (f.to.x - wp - f.from.x)*e + wp*e*e;
    const y = f.from.y + (f.to.y - f.from.y)*e - Math.sin(u*Math.PI)*DH*0.22;
    const scale = 1 - 0.55*e;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(f.from.x + (f.to.x - f.from.x)*e, f.from.y + (f.to.y - f.from.y)*e, 16*scale, 7*scale, 0, 0, Math.PI*2);
    ctx.fill();
    drawBag(x, y, scale, u*9, bag.team);
    if(u >= 1) landed();
  }
  function settled(now){
    const f = bag.fly;
    if(f.res.kind === 'hole' || f.res.kind === 'swish'){
      const u = Math.min(1, (performance.now() - bag.callout.t0)/380);
      if(u < 1) drawBag(hole.x, hole.y + u*6, 0.45*(1 - u*0.8), 0, bag.team);
    } else drawBag(f.to.x, f.to.y, 0.45, 4, bag.team);
    const c = bag.callout;
    if(c){
      const rise = Math.min(1, (now - c.t0)/1000/0.4);
      ctx.fillStyle = c.good ? C.accHi : C.dim;
      ctx.font = '700 19px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center';
      ctx.fillText(c.text, DW/2, DH*0.565 - rise*16);
    }
  }
  function drawBag(x, y, s, rot, team){
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot*0.25); ctx.scale(s, s);
    ctx.fillStyle = team === 'blue' ? C.blue2 : C.red2; rrc(-19, -15, 38, 32, 9); ctx.fill();
    ctx.fillStyle = team === 'blue' ? C.blue : C.red;  rrc(-19, -17, 38, 30, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(236,231,221,.5)'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]); rrc(-13, -11, 26, 18, 5); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
  function rrc(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // ResizeObserver, not window resize: iOS settles its layout after load
  // without firing resize, which is what scrunched the first build
  const ro = new ResizeObserver(size);
  ro.observe(q('#chStage'));
  size(); rollWind();
  defaultTargets();
  if(CH_DIFF[ch.diff].randomTargets) randomTargets();
  nextBag();
  requestAnimationFrame(draw);
});
reg('ch_intro__back', ()=> go('hub'));

/* =====================================================================
   QUICK POUR  (second content-less game.
   Ported from prototypes/perfect-pour.html v3. Three taps, ten cups,
   one count-up clock; the venue logo is etched on every glass and the
   venue accent drives the paddles, the beer line, and the floats.)
   ===================================================================== */
let pp = {};
function ppBest(){ try{ return +(localStorage.getItem('st_qp_best') || 0); }catch(e){ return 0; } }
function ppLoadLogo(){
  const l = venue().logo;
  if(!/^(https?:|images\/)/i.test(l || '')){ pp.logoImg = null; return; }
  const img = new Image();
  img.onload = ()=>{ pp.logoImg = img; };
  img.src = l;
}
reg('pp_intro__back', ()=> go('hub'));
reg('pp_intro', (el)=>{

  const b = ppBest();
  el.innerHTML = `
    <div class="eyebrow">${GNAME.quick_pour}</div>
    <h1 class="big">Run the taps.</h1>
    <p class="lede">Ten cups, three taps, one clock. Touch a lane to open its tap, touch it again to close it. Land the beer on the brass line: dead-on takes half a second off your clock. Foam over the lip is a spill, and every tap locks while you mop. Short pours just wait for a top-off. Fastest time wins the table.</p>
    ${b ? `<div class="howto" style="margin-top:16px;text-align:center">Best on this phone: <b>${b.toFixed(1)}s</b></div>` : ''}
    <button class="btn" id="ppGo" style="margin-top:18px">Open the bar</button>

reg('pp_play', (el)=>{
  // full bleed, same rule as cornhole: drop this screen's own padding
  el.style.padding = '0';
  el.innerHTML = `
    <div class="ch-stage" id="ppStage">
      <canvas id="ppCv"></canvas>
      <div class="ch-bar ch-bar--solid" id="ppBar"></div>
      <div class="ch-hint" id="ppHint" style="display:none">Touch a lane to pour · touch again to stop</div>
      <div class="ch-over" id="ppOver"><div class="ch-card">
        <h3 id="ppOT"></h3><div class="n" id="ppON"></div><div class="l" id="ppOL"></div>
        <div class="v" id="ppOV"></div>
        <button class="btn" id="ppOGo"></button>
        <button class="btn btn--ghost" id="ppOMenu">Back to the menu</button>
      </div></div>
    </div>`;
  const q = s => el.querySelector(s);
  const cv = q('#ppCv'), ctx = cv.getContext('2d'), hintEl = q('#ppHint');
  const acc = getComputedStyle(appEl).getPropertyValue('--accent').trim() || '#3a6ea5';
  // mostly brass with a whisper of the venue accent: stays warm and legible
  // on any brand color (a 50/50 mix went gray on blue-accent venues)
  const BRASS = chMix(acc, '#c08040', 0.72);
  const C = { night:'#171210', cream:'#ece7dd', dim:'#a79b8b', beer:'#e8a33c', beer2:'#a96a1e', foam:'#f4ecda', good:'#7fb069' };

  /* fixed design space, cornhole pattern */
  const DW = 390, DH = 760;
  let W = 0, H = 0, SCL = 1, OX = 0, OY = 0;
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  function size(){
    const st = q('#ppStage');
    W = st.clientWidth; H = st.clientHeight;
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    SCL = Math.min(W / DW, H / DH);
    OX = (W - DW * SCL) / 2; OY = (H - DH * SCL) / 2;
  }

  /* ---- fair game definition (see prototype/HANDOFF for the rationale) ---- */
  const SHAPES = {
    pint:    { topW:98,  botW:74,  h:158 },
    pilsner: { topW:80,  botW:52,  h:180 },
    mug:     { topW:118, botW:104, h:132 }
  };
  const POOL9 = [
    { s:'pint' }, { s:'pilsner' }, { s:'mug' },
    { s:'pint' }, { s:'mug' },     { s:'pilsner' },
    { s:'pint' }, { s:'pilsner' }, { s:'pint' }
  ];
  const FINALE = { s:'mug' };
  const TARGET = 0.84, FOAM = 0.09, OVERB = TARGET + 0.07 + 0.045;
  const FLOW = 6300, DRIP_VOL = FLOW * 0.065;
  const SEED = [0, 1.2, 2.4], SERVE_GAP = 1.6;
  const PERFECT = 0.018, GOOD = 0.07;
  const CLEAN_MS = 1300, CUPS = 10, BONUS = 0.5;
  const LANE_X = [65, 195, 325], LANE_W = 130, YBOT = 596;

  let lanes = [0,1,2].map(()=>({ cup:null, cleanUntil:0 }));
  let deal = [], nextCup = 0, served = 0, perfects = 0, pend = [];
  let t0 = 0, running = false, finished = false, cleanAll = 0, doneAt = 0;
  let floats = [];

  const shuffle = a => { a = a.slice(); for(let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const elapsed = now => (now - t0)/1000;
  const halfAt2 = (sh, f) => (sh.botW + (sh.topW - sh.botW)*f)/2;

  function bar(){
    const b = ppBest();
    q('#ppBar').innerHTML = `<span class="rd">${running || finished ? 'Cups ' + served + ' / ' + CUPS : GNAME.quick_pour}</span>
      <button class="ch-rst" id="ppRst">Restart</button>
      <span class="sc">${b ? `<span class="dsh">best ${b.toFixed(1)}s</span>` : ''}${perfects ? `<span style="color:#7fb069;font-size:13px">-${(perfects*BONUS).toFixed(1)}s</span>` : ''}</span>`;
  }
  function startGame(){
    lanes = [0,1,2].map(()=>({ cup:null, cleanUntil:0 }));
    deal = shuffle(POOL9).concat([FINALE]);
    nextCup = 0; served = 0; perfects = 0; cleanAll = 0;
    pend = SEED.slice(); floats = []; finished = false; running = true; doneAt = 0;
    t0 = performance.now();
    hintEl.style.display = 'block';
    setTimeout(()=>{ hintEl.style.display = 'none'; }, 3200);
    bar();
  }
  function spawn(spec, lane){
    lane.cup = { spec, shape: SHAPES[spec.s], target: TARGET, level:0, st:'idle', dripV:0, tA:0 };
  }
  function riseRate(c){
    const sh = c.shape, w = sh.botW + (sh.topW - sh.botW)*Math.min(c.level, 1);
    return FLOW / (w * sh.h);
  }
  function addFloat(text, laneIx, y, color){
    floats.push({ text, x: LANE_X[laneIx], y, t0: performance.now(), color });
  }
  function laneTap(ix, now){
    if(!running || finished) return;
    const L = lanes[ix];
    if(now < L.cleanUntil || !L.cup) return;
    const c = L.cup;
    if(c.st === 'idle'){ if(now < cleanAll) return; c.st = 'pour'; }
    else if(c.st === 'pour'){ c.dripV = DRIP_VOL; c.st = 'settle'; c.tA = now; }
  }
  cv.addEventListener('pointerdown', (e)=>{
    const r = cv.getBoundingClientRect();
    const x = ((e.clientX - r.left) - OX) / SCL;
    laneTap(x < LANE_W ? 0 : x < LANE_W*2 ? 1 : 2, performance.now());
  });
  function grade(ix, L, now){
    const c = L.cup, d = c.level - c.target, rimY = YBOT - c.shape.h;
    if(d > GOOD || c.level >= 1){
      c.st = 'ruin'; c.tA = now;
      L.cleanUntil = now + CLEAN_MS; cleanAll = now + CLEAN_MS;
      addFloat('SPILL! ALL TAPS LOCKED', ix, rimY - 26, C.dim);
    } else if(d >= -GOOD){
      const isPerfect = Math.abs(d) <= PERFECT;
      if(isPerfect){ perfects++; addFloat('PERFECT -0.5s', ix, rimY - 26, C.good); }
      else addFloat('GOOD', ix, rimY - 26, '#dcae77');
      c.st = 'serve'; c.tA = now;
      // final cup: the clock stops HERE, at the landed pour, not 450ms
      // later when the slide-away animation ends (it also used to leak
      // that animation into the recorded time)
      if(served >= CUPS - 1 && !doneAt) doneAt = now;
    } else {
      c.st = 'idle';
      addFloat('TOP IT OFF', ix, rimY - 26, C.dim);
    }
    bar();
  }
  function finishGame(now){
    finished = true; running = false;
    const raw = doneAt ? (doneAt - t0)/1000 : elapsed(now), fin = Math.max(0, raw - perfects*BONUS);
    const b = ppBest(), isBest = !b || fin < b;
    if(isBest){ try{ localStorage.setItem('st_qp_best', fin.toFixed(1)); }catch(e){} }
    q('#ppOT').textContent = (isBest && b) ? 'New house record!' : 'Bar is clear';
    q('#ppON').textContent = fin.toFixed(1) + 's';
    q('#ppOL').textContent = CUPS + ' cups · ' + perfects + ' perfect' + (perfects === 1 ? '' : 's') + (perfects ? ' (-' + (perfects*BONUS).toFixed(1) + 's)' : '');
    q('#ppOV').textContent =
      isBest && b ? 'New best on this phone. Old best: ' + b.toFixed(1) + 's.' :
      isBest      ? 'That is the time to beat on this phone.' :
                    'Best on this phone: ' + b.toFixed(1) + 's. Pass it on.';
    q('#ppOGo').textContent = 'Pour again';
    q('#ppOGo').onclick = ()=>{ q('#ppOver').classList.remove('show'); startGame(); };
    q('#ppOver').classList.add('show');
    bar();
  }
  q('#ppOMenu').onclick = ()=> go('pp_intro',{exit:true});
  // restart returns to the intro (deliberately two clicks: the timer should
  // never start before the player means it)
  q('#ppBar').addEventListener('click', (e)=>{
    if(e.target.id === 'ppRst') go('pp_intro',{exit:true});
  });

  /* ---- drawing ---- */
  function drawLane(ix, L, now){
    const cx = LANE_X[ix];
    ctx.fillStyle = '#8a6a3c';
    ctx.fillRect(cx - 5, -OY/SCL, 10, 96 + OY/SCL);
    ctx.fillRect(cx - 19, 96, 38, 13);
    ctx.beginPath(); ctx.moveTo(cx - 8, 109); ctx.lineTo(cx + 8, 109); ctx.lineTo(cx + 5, 123); ctx.lineTo(cx - 5, 123); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a5824c'; ctx.fillRect(cx - 19, 96, 38, 3);
    // paddle pull: tall blade, wider at the top, rounded corners
    ctx.fillStyle = BRASS;
    ctx.beginPath();
    ctx.moveTo(cx - 7, 98); ctx.lineTo(cx - 12, 48);
    ctx.quadraticCurveTo(cx - 12, 38, cx - 4, 38); ctx.lineTo(cx + 4, 38);
    ctx.quadraticCurveTo(cx + 12, 38, cx + 12, 48); ctx.lineTo(cx + 7, 98);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath();
    ctx.moveTo(cx - 5, 96); ctx.lineTo(cx - 9, 48); ctx.lineTo(cx - 4, 44); ctx.lineTo(cx - 1, 96);
    ctx.closePath(); ctx.fill();

    if(now < L.cleanUntil){
      const u = 1 - (L.cleanUntil - now)/CLEAN_MS;
      ctx.fillStyle = 'rgba(167,155,139,.85)';
      ctx.save(); ctx.translate(cx + Math.sin(u*Math.PI*4)*22, YBOT - 14);
      ctx.rotate(Math.sin(u*Math.PI*6)*0.3);
      ctx.fillRect(-20, -10, 40, 20); ctx.restore();
      ctx.fillStyle = 'rgba(244,236,218,.4)';
      ctx.beginPath(); ctx.ellipse(cx, YBOT + 6, 42*(1-u) + 8, 5, 0, 0, Math.PI*2); ctx.fill();
    }
    const c = L.cup; if(!c) return;
    const sh = c.shape, rimY = YBOT - sh.h;
    const lv = Math.min(c.level, 1), surfY = YBOT - lv*sh.h;
    let slide = 0, alpha = 1;
    if(c.st === 'serve'){ const su = (now - c.tA)/450; slide = -su*90; alpha = Math.max(0, 1 - su); }
    if(c.st === 'ruin'){ alpha = Math.max(0.25, 1 - (now - c.tA)/900); }
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(0, slide);

    const foamH = lv > 0 ? Math.min(FOAM*sh.h, lv*sh.h*0.5 + 3) : 0;
    const foamTop = surfY - foamH;
    if(c.st === 'pour' || (c.st === 'settle' && now - c.tA < 200)){
      const sw = c.st === 'pour' ? 6 : 3, wob = Math.sin(now/70)*1.1;
      ctx.fillStyle = C.beer;
      ctx.fillRect(cx - sw/2 + wob*0.3, 123, sw, foamTop - 123);
      ctx.fillStyle = 'rgba(244,236,218,.5)';
      ctx.fillRect(cx - sw/2 + wob*0.3 + sw*0.55, 127, 1.4, foamTop - 131);
    }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - halfAt2(sh,1), rimY); ctx.lineTo(cx + halfAt2(sh,1), rimY);
    ctx.lineTo(cx + halfAt2(sh,0), YBOT); ctx.lineTo(cx - halfAt2(sh,0), YBOT);
    ctx.closePath(); ctx.clip();
    if(lv > 0){
      const g = ctx.createLinearGradient(0, surfY, 0, YBOT);
      g.addColorStop(0, C.beer); g.addColorStop(1, C.beer2);
      ctx.fillStyle = g; ctx.fillRect(cx - 70, surfY, 140, YBOT - surfY);
    }
    ctx.restore();
    if(lv > 0){
      const wf = halfAt2(sh, Math.min(lv, 1)) - 1;
      ctx.fillStyle = C.foam;
      ctx.fillRect(cx - wf, foamTop, wf*2, foamH);
      ctx.beginPath();
      for(let fx = -wf + 6; fx <= wf - 6; fx += 11){ ctx.arc(cx + fx, foamTop + Math.sin(now/300 + fx)*1.2, 5.5, 0, Math.PI*2); }
      ctx.fill();
    }
    if(c.st === 'ruin'){
      ctx.fillStyle = 'rgba(244,236,218,.75)';
      ctx.beginPath(); ctx.ellipse(cx, rimY - 2, halfAt2(sh,1)*0.95, 7, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(cx - halfAt2(sh,1) - 1, rimY, 2.5, sh.h*0.5);
      ctx.fillRect(cx + halfAt2(sh,1) - 1, rimY, 2.5, sh.h*0.66);
    }
    // etched venue logo (image, or the wordmark as fallback)
    if(pp.logoImg){
      const bw = Math.min(sh.topW, sh.botW)*0.8, bh = sh.h*0.34;
      const iw = pp.logoImg.naturalWidth || 1, ih = pp.logoImg.naturalHeight || 1;
      const fit = Math.min(bw/iw, bh/ih);
      ctx.save(); ctx.globalAlpha = alpha*0.4;
      ctx.drawImage(pp.logoImg, cx - iw*fit/2, rimY + sh.h*0.44 - ih*fit/2, iw*fit, ih*fit);
      ctx.restore();
    } else {
      ctx.save(); ctx.globalAlpha = alpha*0.45;
      ctx.fillStyle = C.cream;
      ctx.font = '700 11px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center';
      ctx.fillText((venue().logo || venue().name).toUpperCase().slice(0, 14), cx, rimY + sh.h*0.46);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(236,231,221,.55)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - halfAt2(sh,1), rimY - 2); ctx.lineTo(cx - halfAt2(sh,0), YBOT);
    ctx.lineTo(cx + halfAt2(sh,0), YBOT); ctx.lineTo(cx + halfAt2(sh,1), rimY - 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(236,231,221,.28)';
    ctx.fillRect(cx - halfAt2(sh,0) - 3, YBOT, halfAt2(sh,0)*2 + 6, 4);
    const ty = YBOT - c.target*sh.h, half = halfAt2(sh, c.target) + 8;
    const lxE = Math.max(cx - half - 8, 3), rxE = Math.min(cx + half + 8, DW - 3);
    ctx.strokeStyle = BRASS; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(lxE, ty); ctx.lineTo(rxE, ty); ctx.stroke();
    ctx.fillStyle = BRASS;
    ctx.beginPath(); ctx.moveTo(lxE, ty); ctx.lineTo(lxE + 8, ty - 4); ctx.lineTo(lxE + 8, ty + 4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rxE, ty); ctx.lineTo(rxE - 8, ty - 4); ctx.lineTo(rxE - 8, ty + 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function draw(now){
    ctx.fillStyle = C.night; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(OX, OY); ctx.scale(SCL, SCL);
    ctx.fillStyle = '#1e1712'; ctx.fillRect(-OX/SCL, 88, DW + 2*OX/SCL, 2);
    ctx.fillStyle = '#211913';
    for(let i = 0; i < 9; i++){
      const bx = 24 + i*42, bh2 = 30 + (i*37 % 20);
      ctx.fillRect(bx, 88 - bh2, 12, bh2); ctx.fillRect(bx + 3, 88 - bh2 - 7, 6, 7);
    }
    ctx.fillStyle = 'rgba(122,84,51,.35)'; ctx.fillRect(-OX/SCL, YBOT + 4, DW + 2*OX/SCL, DH);
    ctx.fillStyle = 'rgba(138,95,56,.5)'; ctx.fillRect(-OX/SCL, YBOT + 4, DW + 2*OX/SCL, 5);
    ctx.fillStyle = 'rgba(255,255,255,.045)';
    ctx.fillRect(LANE_W - 1, 130, 2, YBOT - 140); ctx.fillRect(LANE_W*2 - 1, 130, 2, YBOT - 140);
    for(let l = 0; l < 3; l++) drawLane(l, lanes[l], now);
    if(running){
      ctx.fillStyle = C.cream; ctx.font = '800 34px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center';
      ctx.fillText((doneAt ? (doneAt - t0)/1000 : elapsed(now)).toFixed(1) + 's', DW/2, DH*0.885);
    }
    for(let f = floats.length - 1; f >= 0; f--){
      const fl = floats[f], age = now - fl.t0;
      if(age > 1300){ floats.splice(f, 1); continue; }
      ctx.globalAlpha = age < 150 ? age/150 : age > 1000 ? (1300-age)/300 : 1;
      ctx.fillStyle = fl.color;
      ctx.font = '800 14px ' + getComputedStyle(document.body).getPropertyValue('--font-d');
      ctx.textAlign = 'center';
      ctx.fillText(fl.text, fl.x, fl.y - age*0.012);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
  let lastT = 0;
  function step(now, dt){
    if(running){
      if(pend.length && elapsed(now) >= pend[0]){
        const free = [];
        for(let i = 0; i < 3; i++) if(!lanes[i].cup && now >= lanes[i].cleanUntil) free.push(i);
        if(free.length){
          pend.shift();
          spawn(deal[nextCup], lanes[free[Math.floor(Math.random()*free.length)]]);
          nextCup++;
        }
      }
      for(let l = 0; l < 3; l++){
        const L = lanes[l], c = L.cup; if(!c) continue;
        if(c.st === 'pour'){
          c.level += riseRate(c) * dt;
          if(c.level >= OVERB){ c.dripV = 0; grade(l, L, now); }
        } else if(c.st === 'settle'){
          const useV = Math.min(c.dripV, FLOW*dt*0.9);
          c.level += useV / ((c.shape.botW + (c.shape.topW - c.shape.botW)*Math.min(c.level,1)) * c.shape.h);
          c.dripV -= useV;
          if(c.level >= OVERB){ c.dripV = 0; grade(l, L, now); }
          else if(c.dripV <= 0.5 && now - c.tA > 320) grade(l, L, now);
        } else if(c.st === 'serve' && now - c.tA > 450){
          L.cup = null; served++; bar();
          if(nextCup + pend.length < CUPS) pend.push(elapsed(now) + SERVE_GAP);
          if(served >= CUPS) finishGame(now);
        } else if(c.st === 'ruin' && now >= L.cleanUntil){
          spawn(c.spec, L);
        }
      }
    }
  }
  function tick(now){
    if(!cv.isConnected){ ro.disconnect(); return; }
    const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
    step(now, dt);
    draw(now);
    requestAnimationFrame(tick);
  }
  pp.state = ()=> ({ running, finished, served, next: nextCup,
    lanes: lanes.map(L => L.cup ? { st: L.cup.st, level: +L.cup.level.toFixed(4), target: L.cup.target, shape: L.cup.spec.s } : null) });
  // test hooks (rt.stepMs pattern): rAF pauses in hidden tabs, so tests
  // drive the sim on a synthetic clock and tap lanes on that same clock
  let simT = null;
  pp.stepMs = (ms)=>{
    if(simT === null) simT = performance.now();
    for(let t = 0; t < ms; t += 16){ simT += 16; step(simT, 0.016); }
    return pp.state();
  };
  pp.tap = (ix)=> laneTap(ix, simT === null ? performance.now() : simT);
  pp.drawNow = ()=> draw(simT === null ? performance.now() : simT);
  const ro = new ResizeObserver(size);
  ro.observe(q('#ppStage'));
  size();
  startGame();
  requestAnimationFrame(t => { lastT = t; tick(t); });
});

/* =====================================================================
   HORSE RACING  (third content-less game; 38_horse_racing.sql plumbing.
   VENUE-EXCLUSIVE, the first one: built for woodloch, whose resort runs
   this as a live show. Six wooden horses on a gridded mat, three dice
   in a spinning cage; every number rolled moves that horse one space.
   The app is the announcer: his exact lines ("WHO DO YOU WAAANT?",
   "NUMBER FIVE IS ALIVE", the winner-in-the-cage tease, sudden death)
   play as timed on-screen callouts while the race runs itself.
   Betting: everyone starts with $10, tickets are $1. Solo pays 5 to 1
   (fair odds for six horses, chosen over even money so the high
   score can actually grow); multiplayer pools every bet and the
   winning horse's backers split the pot. Bets are placed one player
   at a time, pass-the-phone, so nobody games the pool.
   ===================================================================== */
const HR_LEN = 15, HR_SUDDEN_LEN = 5, HR_START_BAL = 10;
const HR_WORDS = ['one','two','three','four','five','six'];
const HR_YELL  = ['ONNNE','TWOOO','THREEEE','FOURRR','FIVEEE','SIXXX'];
/* Plywood-cutout knight profile (matches the venue's real horses), drawn
   in a 100x134 box: horse 0..112, white number plate 113..133. */
const HR_PATH = 'M26,112 L26,84 C26,76 20,70 12,62 C6,56 3,50 5,46 C7,43 11,43 16,44 C25,40 34,32 42,25 C45,21 47,18 49,14 L52,3 L56,12 L62,4 L66,15 C78,22 87,38 89,58 C91,78 90,96 90,112 Z';
/* f fill · o outline · t tack (bridle) · d plate digit · dt die text */
const HR_HORSES = [
  { f:'#2e2925', o:'rgba(255,255,255,.55)', t:'#c3c9cf', d:'#3a352f', dt:'#fff' },     // 1 black
  { f:'#2f9e57', o:'rgba(0,0,0,.28)',       t:'#e3e8ec', d:'#237a42', dt:'#fff' },     // 2 green
  { f:'#d1453b', o:'rgba(0,0,0,.28)',       t:'#eddcd3', d:'#b03328', dt:'#fff' },     // 3 red
  { f:'#e8b93a', o:'rgba(0,0,0,.28)',       t:'#f8eed4', d:'#a67a20', dt:'#4a3c14' },  // 4 yellow
  { f:'#2f5fa8', o:'rgba(0,0,0,.28)',       t:'#e3e8ec', d:'#24487f', dt:'#fff' },     // 5 blue
  { f:'#f4f1ea', o:'rgba(60,54,46,.6)',     t:'#9aa0a6', d:'#6b6f74', dt:'#55504a' },  // 6 white
];
let hr = {}, hrSetup = { players:[] };
function hrBest(){ try{ return +(localStorage.getItem('st_hr_best') || 0); }catch(e){ return 0; } }
function hrFmt(n){ const v = Math.round(n*100)/100; return '$' + (Number.isInteger(v) ? v : v.toFixed(2)); }
function hrChip(n, sm){ const c = HR_HORSES[n-1]; return `<span class="hr-die${sm?' sm':''}" style="background:${c.f};color:${c.dt}">${n}</span>`; }
function hrChipDown(){ return '<span class="hr-die down">?</span>'; }
function hrPot(){ return hr.bets.reduce((s,b)=>s+b.reduce((x,y)=>x+y,0),0); }
/* The same cutout as inline SVG, for the betting rows and winner screens. */
function horseSVG(n, w){
  const c = HR_HORSES[n-1];
  return `<svg width="${w}" height="${Math.round(w*1.34)}" viewBox="0 0 100 134" aria-hidden="true">
    <path d="${HR_PATH}" fill="${c.f}" stroke="${c.o}" stroke-width="2.5"/>
    <path d="M34,42 L9,50 M34,42 L64,84 M64,84 L60,110" stroke="${c.t}" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="34" cy="42" r="4.5" fill="${c.t}"/><circle cx="64" cy="84" r="4.5" fill="${c.t}"/>
    <circle cx="45" cy="26" r="3" fill="${n===1?'#cfc9c0':'#241f1a'}"/>
    <rect x="38" y="113" width="24" height="20" rx="5" fill="#fff" stroke="rgba(0,0,0,.25)"/>
    <text x="50" y="129" text-anchor="middle" font-family="var(--font-d)" font-weight="800" font-size="16" fill="${c.d}">${n}</text>
  </svg>`;
}
function hrNewGame(mode, names){
  hr = { mode, players: names.map(n=>({ name:n, bal:HR_START_BAL, out:false })), raceN:0, icon:{} };
}
function hrNextBettor(from){
  for(let i=from;i<hr.players.length;i++) if(!hr.players[i].out) return i;
  return -1;
}
function hrBeginBetting(){
  hr.raceN++;
  hr.bets = hr.players.map(()=>[0,0,0,0,0,0]);
  hr.turn = hrNextBettor(0);
  if(hr.mode==='solo') go('hr_bet',{exit:true});
  else go('hr_bet_pass',{exit:true});
}
function hrStartRace(){
  hr.race = { len:HR_LEN, lanes:[1,2,3,4,5,6], pos:[0,0,0,0,0,0], sudden:0 };
  go('hr_race',{exit:true});
}
/* Payouts. Solo: a winning $1 ticket returns $6 (5 to 1 plus the stake).
   Multiplayer: the whole pot, split across the winning tickets. A pot
   nobody claimed just disappears, no rollover, same as the live show. */
function hrSettle(w){
  const pot = hrPot();
  const winT = hr.bets.reduce((s,b)=>s+b[w-1],0);
  hr.results = hr.players.map((p,i)=>{
    const spent = hr.bets[i].reduce((x,y)=>x+y,0);
    const won = hr.mode==='solo'
      ? hr.bets[i][w-1]*6
      : (winT ? Math.round(pot*hr.bets[i][w-1]/winT*100)/100 : 0);
    return { spent, won };
  });
  hr.results.forEach((r,i)=>{
    const p = hr.players[i];
    p.bal = Math.round((p.bal + r.won)*100)/100;
    if(p.bal < 1) p.out = true;   // cannot buy a ticket = out
  });
  hr.winHorse = w; hr.potWas = pot; hr.winTicketsWas = winT;
}

});

  function size(){

  const MATX = 12, MATW = 366, LANEW = MATW/6;

    q('#hrBar').innerHTML = `<span class="rd">${R.sudden ? 'Sudden death' : 'Race ' + hr.raceN}</span>
      <span class="sc" style="font-size:14px;color:#cfc9bf">${info}</span>
      ${dice ? `<span class="rt" style="display:flex;justify-content:center;gap:6px;align-items:center">${dice.map(d=>hrChip(d,true)).join('')}</span>` : ''}`;
  }

  /* the announcer: lines build one at a time, holding for his pauses.
     A phase's `dice` list flips that many face-down cage dice face-up AS
     the line prints, so the call and the reveal land together. */
  async function say(phases){
    callEl.innerHTML = ''; callEl.classList.add('show');
    for(const ph of phases){
      if(!ok()) return;
      if(ph.dice) ph.dice.forEach(n=> revealDie(n));
      const d = document.createElement('div');
      d.className = 'ln' + (ph.big ? ' big' : '');
      d.textContent = ph.t;
      callEl.appendChild(d);
      await wait(ph.hold);
    }
    callEl.classList.remove('show');
  }
  /* the cage: spins with the dice tumbling, then settles FACE-DOWN and
     STAYS UP while the announcer calls it (like the live show, the
     cage sits there, but the dice only turn over as he reads them, so the
     call keeps its suspense). The race loop hides it when horses move. */
  async function rollCage(fast){
    cageEl.classList.add('show','rolling');
    const spin = setInterval(()=>{
      diceEl.innerHTML = [0,1,2].map(()=> hrChip(R.lanes[Math.floor(Math.random()*R.lanes.length)])).join('');
    }, 90);
    diceEl.innerHTML = [0,1,2].map(()=> hrChip(R.lanes[Math.floor(Math.random()*R.lanes.length)])).join('');
    await wait(fast ? 550 : 800);
    clearInterval(spin);
    cageEl.classList.remove('rolling');
    diceEl.innerHTML = [0,1,2].map(()=> hrChipDown()).join('');
  }
  function revealDie(n){
    const d = diceEl.querySelector('.hr-die.down');
    if(d) d.outerHTML = hrChip(n);
  }
  function hideCage(){ cageEl.classList.remove('show','rolling'); }
  /* one hop, one horse, one space */
  function hop(n, fast){
    return new Promise(res=>{
      const a = ay[n], dur = fast ? 240 : 300;
      R.pos[n-1]++;
      a.from = a.p; a.to = Math.min(R.pos[n-1], R.len + 0.9);
      a.t0 = performance.now(); a.dur = dur;
      setTimeout(()=>{ a.p = a.to; res(); }, dur + (fast ? 90 : 130));
    });
  }

  // hr.rig: test hook (pp.state pattern) — an array of [d,d,d] rolls consumed
  // before random ones. Console-only; everything here is client-side anyway.
  const draw3 = ()=>{
    if(Array.isArray(hr.rig) && hr.rig.length) return hr.rig.shift().slice().sort((a,b)=>a-b);
    return [0,0,0].map(()=> R.lanes[Math.floor(Math.random()*R.lanes.length)]).sort((a,b)=>a-b);
  };
  function classify(dice){
    const c = {}; dice.forEach(d=> c[d] = (c[d]||0)+1);
    const ns = Object.keys(c).map(Number).sort((a,b)=>a-b);
    if(ns.length === 1) return { kind:'triple', n:ns[0] };
    if(ns.length === 2){ return { kind:'double', d:ns.find(x=>c[x]===2), s:ns.find(x=>c[x]===1) }; }
    return { kind:'singles', ns };
  }

  async function suddenDeath(tied){
    await say([
      { t:`We have ${tied.length} horses across the finish line.`, hold:950 },
      { t:'You know what that means?', hold:900 },
      { t:'SUDDEN DEATH!!', big:true, hold:1250 }
    ]); if(!ok()) return;
    R.sudden++;
    R.len = HR_SUDDEN_LEN;
    R.lanes = tied.slice();
    tied.forEach(n=>{ R.pos[n-1] = 0; });
    resetAnim();
    bar();
    await wait(500); if(!ok()) return;
    await say([{ t:'WHO DO YOU WAAANT?', big:true, hold:1200 }]);
  }

  async function race(){
    await wait(450); if(!ok()) return;
    await say([{ t:'Betting is closed.', hold:1000 }]); if(!ok()) return;
    await say([{ t:'WHO DO YOU WAAANT?', big:true, hold:1450 }]); if(!ok()) return;
    let rolls = 0;
    while(ok()){
      rolls++;
      const fast = rolls > 9;
      const dice = draw3();
      const cls = classify(dice);
      const gain = {}; dice.forEach(d=> gain[d] = (gain[d]||0)+1);
      const crossers = R.lanes.filter(n => R.pos[n-1] + (gain[n]||0) >= R.len);
      const contenders = R.lanes.filter(n => R.pos[n-1] >= R.len - 3).length;
      /* the tease is only for a roll that DOES win it, while 2+ horses were
         in striking range; ties read normally, triples carry their own drama */
      const cage = crossers.length === 1 && contenders >= 2 && cls.kind !== 'triple';
      await rollCage(fast); if(!ok()) return;
      /* a matched SIX gets the announcer's "on the outside" tag (the white
         horse runs lane six); winner-tease singles read plain */
      const six = n => n === 6 ? HR_YELL[5] + ' on the outside' : HR_YELL[n-1];
      /* each phase's `dice` flips those cage dice face-up with the line, so
         the numbers stay hidden until the exact moment they are called */
      let phases = [], order = [];
      if(cls.kind === 'triple'){
        /* triples hold longest: extra beat before the number, extra after */
        phases = [
          { t:'We have a TRIPLE number.', hold:1000 },
          { t:'WHO DO YOU WAAANT?', big:true, hold:1250 },
          { t:`It's a TRIPLE ${six(cls.n)}!`, big:true, hold:1500, dice:[cls.n, cls.n, cls.n] }
        ];
        order = [cls.n, cls.n, cls.n];
      } else if(cls.kind === 'double'){
        if(cage && crossers[0] === cls.s){
          /* the single is the winner: read the double first, winner last */
          phases = [
            { t:`A DOUBLE ${HR_WORDS[cls.d-1]} and a number...`, hold:1150, dice:[cls.d, cls.d] },
            { t:`${HR_YELL[cls.s-1]}!`, big:true, hold:1250, dice:[cls.s] }
          ];
          order = [cls.d, cls.d, cls.s];
        } else {
          phases = [
            { t:`Number ${HR_WORDS[cls.s-1]} and a DOUBLE...`, hold:1150, dice:[cls.s] },
            { t:`${six(cls.d)}!`, big:true, hold:1300, dice:[cls.d, cls.d] }
          ];
          if(cls.d === 5 && !crossers.length) phases.push({ t:'NUMBER FIVE IS ALIVE!', big:true, hold:1050 });
          order = [cls.s, cls.d, cls.d];
        }
      } else if(cage){
        const w = crossers[0], others = cls.ns.filter(n=>n!==w);
        phases = [
          { t:`Number ${HR_WORDS[others[0]-1]}, ${HR_WORDS[others[1]-1]} and...`, hold:750, dice: others.slice() },
          { t:`${HR_YELL[w-1]}!`, big:true, hold:1100, dice:[w] }
        ];
        order = [...others, w];
      } else {
        phases = [{ t:`Number ${HR_WORDS[cls.ns[0]-1]}, ${HR_WORDS[cls.ns[1]-1]} and ${HR_WORDS[cls.ns[2]-1]}`, hold: fast ? 750 : 950, dice: cls.ns.slice() }];
        order = cls.ns.slice();
      }
      if(cage) phases = [
        { t:'I have a winner in the cage.', hold:1100 },
        { t:'WHO DO YOU WAAANT?', big:true, hold:1300 },
        ...phases
      ];
      await say(phases); if(!ok()) return;
      hideCage();   // the cage and its roll leave with the announcer text
      bar(dice);
      for(const n of order){ await hop(n, fast); if(!ok()) return; }
      const done = R.lanes.filter(n => R.pos[n-1] >= R.len);
      if(done.length === 1){
        winN = done[0]; winAt = performance.now();
        const rct = cv.getBoundingClientRect();
        confettiBurst(rct.left + OX + laneCx(winN)*SCL, rct.top + OY + (TRKTOP - 30)*SCL);
        /* the winner call spells the number normally (the operator): the stretched
           yell is for roll reveals, not the result */
        await say([{ t:`NUMBER ${HR_WORDS[winN-1].toUpperCase()} WINS!`, big:true, hold:1800 }]);
        if(!ok()) return;
        hrSettle(winN);
        go('hr_result',{exit:true});
        return;
      }
      if(done.length > 1){ await suddenDeath(done); if(!ok()) return; continue; }
      await wait(fast ? 260 : 380);
    }
  }

  /* ---- drawing ---- */
  const horsePath = new Path2D(HR_PATH);
  function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  function rr(x,y,w,hh,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+hh,r); ctx.arcTo(x+w,y+hh,x,y+hh,r); ctx.arcTo(x,y+hh,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function drawHorse(n, cx, yBot, rock, s){
    const c = HR_HORSES[n-1];
    ctx.save();
    ctx.translate(cx, yBot); ctx.rotate(rock);
    ctx.scale(s, s); ctx.translate(-50, -134);
    ctx.fillStyle = c.f; ctx.fill(horsePath);
    ctx.strokeStyle = c.o; ctx.lineWidth = 2.5; ctx.stroke(horsePath);
    ctx.strokeStyle = c.t; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(34,42); ctx.lineTo(9,50); ctx.moveTo(34,42); ctx.lineTo(64,84); ctx.moveTo(64,84); ctx.lineTo(60,110); ctx.stroke();
    ctx.fillStyle = c.t;
    ctx.beginPath(); ctx.arc(34,42,4.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(64,84,4.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = n===1 ? '#cfc9c0' : '#241f1a';
    ctx.beginPath(); ctx.arc(45,26,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; rr(38,113,24,20,5); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = c.d; ctx.font = '800 17px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(n, 50, 129);
    ctx.restore();
  }
  function eased(a, now){
    if(!a.dur || now >= a.t0 + a.dur){ a.p = a.to || a.p; return a.p; }
    const u = (now - a.t0)/a.dur, e = 1 - Math.pow(1-u, 3);
    return a.from + (a.to - a.from)*e;
  }
  function draw(now){
    ctx.fillStyle = '#14110e'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(OX, OY); ctx.scale(SCL, SCL);
    const exL = -OX/SCL, exW = DW + 2*OX/SCL;
    // curtain valance
    ctx.fillStyle = '#6b1622'; ctx.fillRect(exL, -OY/SCL, exW, CURT + OY/SCL);
    ctx.fillStyle = 'rgba(0,0,0,.24)';
    for(let x = exL; x < exL + exW; x += 26) ctx.fillRect(x, -OY/SCL, 10, CURT + OY/SCL);
    ctx.fillStyle = '#c9a13f'; ctx.fillRect(exL, CURT - 3, exW, 3);
    // the mat
    ctx.fillStyle = '#1c1916'; ctx.fillRect(MATX, CURT + 8, MATW, TRKBOT - CURT);
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    ctx.strokeRect(MATX, CURT + 8, MATW, TRKBOT - CURT);
    // finish zone label
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.font = '700 12px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('F I N I S H', DW/2, CHKTOP - 12);
    // checkered line
    const sq = CHK/2;
    for(let i = 0; i < 2; i++) for(let x = MATX; x < MATX + MATW; x += sq){
      ctx.fillStyle = ((x - MATX)/sq + i) % 2 < 1 ? '#efeae0' : '#211d19';
      ctx.fillRect(x, CHKTOP + i*sq, Math.min(sq, MATX + MATW - x), sq);
    }
    // grid
    const ch = cellH();
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1;
    for(let rI = 1; rI < R.len; rI++){ const y = TRKBOT - rI*ch; line(MATX, y, MATX + MATW, y); }
    for(let l = 1; l < 6; l++){ const x = MATX + LANEW*l; line(x, TRKTOP, x, TRKBOT); }
    // start line, a touch bolder
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2;
    line(MATX, TRKBOT, MATX + MATW, TRKBOT);
    // horses, furthest first so nearer ones overlap naturally
    const list = R.lanes.map(n=>({ n, p: eased(ay[n], now) })).sort((a,b)=> b.p - a.p);
    const s = ch > 70 ? 0.56 : 0.5;
    for(const it of list){
      const a = ay[it.n];
      const moving = now < a.t0 + a.dur;
      const u = moving ? (now - a.t0)/a.dur : 0;
      const rock = moving ? Math.sin(u*Math.PI) * -0.12 : 0;
      const lift = moving ? Math.sin(u*Math.PI) * 6 : 0;
      const bounce = winN === it.n ? Math.abs(Math.sin((now - winAt)/180)) * 8 : 0;
      drawHorse(it.n, laneCx(it.n), TRKBOT - Math.min(it.p, R.len + 0.9)*ch - 3 - lift - bounce, rock, s);
    }
    ctx.restore();
  }
  function tick(now){
    if(!cv.isConnected){ ro.disconnect(); return; }
    draw(now);
    requestAnimationFrame(tick);
  }
  hr.drawNow = ()=> draw(performance.now());   // read-only debug handle for tests, pp.state pattern
  const ro = new ResizeObserver(size);
  ro.observe(q('#hrStage'));
  size();
  bar();
  requestAnimationFrame(tick);
  race();
});

reg('hr_result', (el)=>{
  const w = hr.winHorse, solo = hr.mode==='solo';
  const alive = hr.players.filter(p=>!p.out).length;
  const canRace = solo ? !hr.players[0].out : alive >= 2;
  const myT = solo ? hr.bets[0][w-1] : 0;
  const sub = solo
    ? (myT ? `You had ${myT} winning ticket${myT===1?'':'s'}.` : (hr.results[0].spent ? 'None of your tickets came in.' : 'You sat that one out.'))
    : (hr.winTicketsWas ? `${hrFmt(hr.potWas)} pot, split across ${hr.winTicketsWas} winning ticket${hr.winTicketsWas===1?'':'s'}.` : `Nobody backed number ${w}. The pot goes home with the house.`);
  const rows = hr.players.map((p,i)=>{
    const r = hr.results[i];
    const net = Math.round((r.won - r.spent)*100)/100;
    const cls = net > 0 ? 'up' : net < 0 ? 'down' : 'flat';
    const netTxt = net > 0 ? '+' + hrFmt(net) : net < 0 ? '-' + hrFmt(-net) : 'even';
    const betsTxt = hr.bets[i].map((t,ix)=> t ? `${t} on ${ix+1}` : null).filter(Boolean).join(', ') || 'sat out';
    return `<div class="scorerow"><span class="who"><span class="pico">${hr.icon[p.name]||''}</span>${escHtml(p.name)}<span class="hr-sub">${betsTxt}${p.out ? ' · out of money' : ''}</span></span><span style="text-align:right"><span class="hr-net ${cls}">${netTxt}</span><span class="hr-sub">${hrFmt(p.bal)}</span></span></div>`;
  }).join('');
  el.innerHTML = `
    <div class="spacer"></div>
    <div style="text-align:center">${horseSVG(w, 96)}</div>
    <div class="endcard" style="padding:16px 22px;margin-top:8px">
      <div class="endcard__line" style="margin-top:0;font-size:24px">Number ${w} wins${hr.race.sudden ? ' the sudden death' : ''}!</div>
      <div class="endcard__sub">${sub}</div>
    </div>
    <div class="stack">
      ${canRace ? '<button class="btn" id="again">Race again ›</button>' : ''}
      <button class="btn btn--ghost" id="end">End game</button>
    </div>
    ${canRace ? '' : `<p class="lede" style="text-align:center;margin-top:12px">${solo ? 'The house cleaned you out.' : 'Not enough players still have money to race.'}</p>`}
    <div class="standings__h" style="margin-top:18px">Balances</div>
    <div class="scoreboard">${rows}</div>
    <div class="spacer"></div>`;
  const again = el.querySelector('#again');
  if(again) again.onclick = ()=> hrBeginBetting();
  el.querySelector('#end').onclick = ()=> go('hr_final',{exit:true});
});

reg('hr_final', (el)=>{
  if(hr.mode === 'solo'){
    const bal = hr.players[0].bal;
    const best = hrBest();
    const isBest = bal > best;
    if(isBest){ try{ localStorage.setItem('st_hr_best', String(bal)); }catch(e){} }
    el.innerHTML = `
      <div class="spacer"></div>
      <div class="crown">🏇</div>
      <div class="endcard" style="padding-top:20px">
        <div class="endcard__line" style="margin-top:0;font-size:24px">${isBest && best ? 'New high score!' : bal < 1 ? 'The house thanks you.' : 'You cashed out.'}</div>
        <div class="endcard__sub" style="font-family:var(--font-d);font-weight:800;font-size:34px;color:var(--ink);margin-top:8px">${hrFmt(bal)}</div>
        <div class="endcard__sub">${hr.raceN} race${hr.raceN===1?'':'s'} · started with ${hrFmt(HR_START_BAL)}</div>
        ${isBest ? (best ? `<div class="endcard__sub">Old best on this phone: ${hrFmt(best)}.</div>` : '<div class="endcard__sub">That is the number to beat on this phone.</div>') : `<div class="endcard__sub">Best on this phone: ${hrFmt(best)}.</div>`}
      </div>
      <div class="stack">
        <button class="btn" id="againG">Play again</button>
        <button class="btn btn--ghost" id="home">Back to games</button>
      </div>
      <div class="spacer"></div>`;
    el.querySelector('#againG').onclick = ()=>{ hrNewGame('solo',['You']); hrBeginBetting(); };
  } else {
    const sorted = [...hr.players].sort((a,b)=> b.bal - a.bal);
    const top = sorted[0].bal;
    const winners = sorted.filter(p=> p.bal === top);
    const tie = winners.length > 1;
    const rows = sorted.map((p,i)=>
      `<div class="scorerow ${p.bal===top?'lead':''}"><span class="who"><span class="rank">${i+1}</span><span class="pico">${hr.icon[p.name]||''}</span>${escHtml(p.name)}</span><span class="pts">${hrFmt(p.bal)}</span></div>`).join('');
    el.innerHTML = `
      <div class="spacer"></div>
      <div class="crown">👑</div>
      <div class="endcard" style="padding-top:20px">
        <div class="endcard__line" style="margin-top:0;font-size:24px">${tie ? `It's a tie: ${winners.map(p=>escHtml(p.name)).join(' & ')}` : `${escHtml(winners[0].name)} rides home richest`}</div>
        <div class="endcard__sub">${tie ? 'Split the glory.' : `Turned ${hrFmt(HR_START_BAL)} into ${hrFmt(top)} over ${hr.raceN} race${hr.raceN===1?'':'s'}.`}</div>
      </div>
      <div class="standings__h" style="text-align:center">Final balances</div>
      <div class="scoreboard">${rows}</div>
      <div class="stack">
        <button class="btn" id="againG">Rematch</button>
        <button class="btn btn--ghost" id="home">Back to games</button>
      </div>
      <div class="spacer"></div>`;
    celebrateCrown(el);
    el.querySelector('#againG').onclick = ()=>{
      const names = hr.players.map(p=>p.name), icons = hr.icon;
      hrNewGame('vs', names); hr.icon = icons; hrBeginBetting();
    };
  }
  el.querySelector('#home').onclick = ()=> go('hub');
});

/* =====================================================================
   RING TOSS  (fourth content-less game; 39_ring_toss.sql plumbing.
   VENUE-EXCLUSIVE, the second one: built for woodloch, whose resort has
   the classic hook-and-ring game outside on a tree. A ring hangs from a
   branch on a string; you pull it back and let it swing toward the
   trunk, trying to drop it onto a hook. The perfect throw JUST reaches
   the hook and lands soft; too much power clangs off the tree.
   One control: hold anywhere to pull the ring back, release to swing.
   Ten swings a round, one point per catch, best round kept per phone
   (st_rt_best). Real pendulum physics in the same fixed 390x760 design
   space as cornhole (ResizeObserver + isConnected loop-stop).
   Test hooks (pp.state pattern): rt.state() reads the round; rt.throwAt(deg)
   releases a swing at an exact pull-back angle, bypassing the pointer.
   ===================================================================== */
let rt = {};
function rtBest(){ try{ return +(localStorage.getItem('st_rt_best') || -1); }catch(e){ return -1; } }
function rtLoadLogo(){
  const l = venue().logo;
  if(!/^(https?:|images\/)/i.test(l || '')){ rt.logoImg = null; return; }
  const img = new Image();
  img.onload = ()=>{ rt.logoImg = img; };
  img.src = l;
}
reg('rt_intro__back', ()=> go('hub'));

    <div class="eyebrow">Ring Toss</div>
    <h1 class="big">Land the ring on the hook.</h1>
    <p class="lede">Press and hold to pull the ring back and set your power. Let go to toss the ring at the hook. Ten swings, one point per catch.</p>
    ${b >= 0 ? `<div class="howto" style="margin-top:16px;text-align:center">Best on this phone: <b>${b} / 10</b></div>` : ''}
    <button class="btn" id="rtGo" style="margin-top:18px">Grab the ring</button>
    <div class="spacer"></div>`;
  el.querySelector('#rtGo').onclick = ()=>{
    logPlay('ring_toss');
