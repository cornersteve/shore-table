<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Table Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='10'%20y='10'%20width='44'%20height='44'%20rx='11'%20fill='%233a6ea5'/%3E%3Cpath%20d='M18%2024Q21.5%2020.4%2025%2024T32%2024T39%2024T46%2024M18%2033Q21.5%2029.4%2025%2033T32%2033T39%2033T46%2033M18%2042Q21.5%2038.4%2025%2042T32%2042T39%2042T46%2042'%20fill='none'%20stroke='%23fff'%20stroke-width='3.4'%20stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://wryscqcukjduaodgfmdl.supabase.co" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     SHORE TABLE  ·  wired to Supabase (Phase 4).
     One file. Drag it onto any host (Netlify / Cloudflare Pages).
     Venue branding and every game/survey question are read LIVE
     from the database, so adding a venue or editing a question is
     a row edit in Supabase — no touching this file, no redeploy.
     The only thing set in this file is the Supabase URL + key.
     ============================================================ */

  :root{
    --bg:#ffffff;
    --page:#eeede9;          /* behind the phone frame */
    --panel:#faf9f6;         /* soft card fill */
    --panel-2:#efece6;       /* track / pressed */
    --ink:#1b1813;
    --ink-dim:#7c766c;
    --ink-faint:#aaa399;
    --line:rgba(22,17,10,.10);
    --line-2:rgba(22,17,10,.16);
    --good:#2e9e63;
    --accent:#3a6ea5;        /* one solid color, set per venue at runtime */
    --on-accent:#ffffff;     /* auto-computed for contrast */
    --radius:18px;
    --maxw:440px;
    --ease:cubic-bezier(.2,.8,.2,1);
    --shadow:0 1px 2px rgba(22,17,10,.05),0 6px 20px rgba(22,17,10,.06);
    --shadow-sm:0 1px 2px rgba(22,17,10,.06);
    --font-d:"Bricolage Grotesque",system-ui,sans-serif;
    --font-b:"Hanken Grotesk",system-ui,sans-serif;  /* NOTE the spelling: "Hanken Grotesk" is the real Google font; the old "Grotesque" misspelling silently never loaded */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  /* Kill iOS Safari's double-tap-to-zoom on all controls (fast repeated taps
     on the Wordy keyboard read as double-taps and zoom the page). Scrolling
     and pinch zoom are unaffected. */
  button,input,textarea{touch-action:manipulation}
  html,body{height:100%}
  body{
    font-family:var(--font-b);color:var(--ink);background:var(--page);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;height:100dvh;overflow:hidden;
  }

  /* ---------- the phone (what the diner sees) ---------- */
  .phone{
    width:100%;max-width:var(--maxw);flex:1;min-height:0;background:var(--bg);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(22,17,10,.10);
  }

  /* ---------- brand bar ---------- */
  /* z-index 3: one above .stage, so the nav-style drop shadow casts onto the
     screen content below instead of being painted over. */
  .brand{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 18px 15px;border-bottom:3px solid transparent;min-height:62px}
  .phone.branded .brand{border-bottom-color:var(--accent);box-shadow:0 2px 8px rgba(22,17,10,.08)}  /* divider + shadow invisible until real venue branding is known (no default-blue flash) */
  /* the logo is a button: tapping it goes home to the chooser, like a website header */
  .brand__logo{font-family:var(--font-d);font-weight:800;letter-spacing:.03em;font-size:17px;line-height:1;text-transform:uppercase;display:inline-flex;align-items:center;gap:9px;color:var(--ink);background:transparent;border:0;padding:0;cursor:pointer;max-width:calc(100% - 120px)}
  .brand__logo:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
  .brand__logo .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
  .brand__img{max-height:55px;max-width:200px;object-fit:contain;display:block}
  .brand__back{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--accent);font-size:28px;line-height:1;cursor:pointer;padding:6px}
  .brand__exit{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.02em;padding:8px 13px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .brand__exit:active{transform:translateY(-50%) scale(.96)}
  .brand__exit:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---------- screen system ---------- */
  .stage{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column}
  .screen{flex:1;min-height:0;display:none;flex-direction:column;padding:22px 20px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .3s var(--ease)}
  .screen.is-active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .eyebrow{font-family:var(--font-d);font-weight:700;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--accent);margin-bottom:14px}
  h1.big{font-family:var(--font-d);font-weight:700;font-size:clamp(26px,7.5vw,34px);line-height:1.06;letter-spacing:-.01em}
  .lede{color:var(--ink-dim);font-size:15px;line-height:1.5;margin-top:10px}
  .spacer{flex:1}

  /* ---------- buttons ---------- */
  .btn{font-family:var(--font-d);font-weight:700;font-size:16px;border:0;border-radius:14px;padding:16px 18px;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);letter-spacing:.01em;box-shadow:var(--shadow-sm);transition:transform .12s var(--ease),filter .2s var(--ease)}
  .btn:active{transform:scale(.985)}
  .btn:hover{filter:brightness(1.04)}
  .btn--ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
  .btn--ghost:hover{filter:none;border-color:var(--accent)}
  .btn--ghost:active{background:var(--panel)}
  .btn.sm{font-size:14px;padding:13px 16px;width:auto}
  .btn:focus-visible,.choice:focus-visible,.rate__dot:focus-visible,.opt:focus-visible,.pill:focus-visible,.namechip button:focus-visible,.gamecard:focus-visible,.landing-opt:focus-visible,.privacy-link:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---------- games hub cards ---------- */
  /* 2% accent wash, deliberately faint so it never competes with a hot notice
     card's 7%. Solid fallback first for browsers without color-mix. */
  .gamecard{flex-shrink:0;text-align:left;width:100%;cursor:pointer;background:var(--bg);background:color-mix(in srgb, var(--accent) 2%, white);color:var(--ink);border:1.5px solid var(--accent);border-radius:var(--radius);padding:15px 17px;margin-top:11px;box-shadow:var(--shadow);transition:transform .14s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease);position:relative;overflow:hidden}
  .gamecard:active{transform:scale(.99)}
  .gamecard:hover{border-color:var(--accent)}
  .gamecard__k{font-family:var(--font-d);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--accent)}
  .gamecard__t{font-family:var(--font-d);font-weight:700;font-size:19px;margin-top:5px}
  .gamecard__d{color:var(--ink-dim);font-size:14px;line-height:1.4;margin-top:4px}
  .gamecard__arrow{position:absolute;right:16px;top:15px;color:var(--ink-faint);font-size:20px}

  /* ---------- hot notice card (the saturated accent banner) ---------- */
  .promo{position:relative;margin-top:16px;background:var(--panel);background:color-mix(in srgb, var(--accent) 7%, white);border:1.5px solid var(--accent);border-radius:var(--radius);padding:14px 16px}
  .promo__k{font-family:var(--font-d);font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:16px;color:var(--accent);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .promo__t{font-size:15px;line-height:1.45;white-space:pre-line}
  /* owner set a link: the whole card becomes a button, opens in a new tab */
  a.promo{display:block;text-decoration:none;color:var(--ink);cursor:pointer;padding-right:42px;box-shadow:var(--shadow);transition:transform .14s var(--ease)}
  a.promo:active{transform:scale(.99)}
  a.promo:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .promo__arrow{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:22px;line-height:1}

  /* ---------- fortune teller ---------- */
  .fcards{display:flex;gap:12px;justify-content:center;margin-top:26px;perspective:900px}
  .fcard{flex:0 1 104px;aspect-ratio:5/7;background:transparent;border:0;padding:0;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .5s var(--ease),opacity .4s var(--ease)}
  .fcard .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:28px}
  .fcard .back{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
  .fcard .front{background:var(--bg);border:1.5px solid var(--accent);color:var(--accent);transform:rotateY(180deg)}
  .fcard.flip{transform:rotateY(180deg)}
  .fcard.dim{opacity:.35;pointer-events:none}
  .fcard:not(.flip):hover{transform:translateY(-4px)}
  .fcard:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:14px}
  .fortune-panel{margin-top:24px;background:var(--panel);background:color-mix(in srgb, var(--accent) 7%, white);border:1.5px solid var(--accent);border-radius:var(--radius);padding:18px;text-align:center;animation:fade .4s var(--ease)}
  .fortune-panel .fortune-k{font-family:var(--font-d);font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--accent);margin-bottom:8px}
  .fortune-panel .fortune-t{font-size:17px;line-height:1.5}

  /* ---------- all talk ---------- */
  .atq{font-family:var(--font-d);font-weight:700;font-size:clamp(24px,6.5vw,30px);line-height:1.15;text-align:center;margin-top:14px}
  .at-step{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-align:center;margin-top:20px}
  .at-players{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
  .atp{font-family:var(--font-d);font-weight:700;font-size:15px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line-2);border-radius:999px;padding:10px 16px;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease),color .15s var(--ease)}
  .atp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .atp:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .at-clock{font-family:var(--font-d);font-weight:800;font-size:64px;line-height:1;text-align:center;margin:10px 0 4px;font-variant-numeric:tabular-nums}
  .at-clock.low{color:#b3372f}
  .at-tally{width:100%;border:2px solid var(--accent);background:var(--bg);background:color-mix(in srgb, var(--accent) 4%, white);border-radius:var(--radius);padding:26px 20px;cursor:pointer;text-align:center;box-shadow:var(--shadow);transition:transform .08s var(--ease)}
  .at-tally:active{transform:scale(.98)}
  .at-tally .n{font-family:var(--font-d);font-weight:800;font-size:clamp(42px,12vw,56px);line-height:1;color:var(--accent)}
  .at-tally .of{color:var(--ink-dim);font-size:15px;margin-top:6px}
  .at-tally .tap{font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-top:12px}

  /* ---------- how-to card + percent picker (Guess the Split) ---------- */
  .howto{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:18px 0}
  .howto__step{display:flex;gap:10px;margin:8px 0;font-size:15px;line-height:1.4;text-align:left}
  .howto__n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--font-d);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .guess-num{font-family:var(--font-d);font-weight:800;font-size:56px;text-align:center;line-height:1;margin:20px 0 4px;color:var(--ink)}
  .guess-num small{font-size:26px;color:var(--ink-dim)}
  input[type=range].gslider{width:100%;accent-color:var(--accent);height:34px;margin:4px 0 2px}
  .nudges{display:flex;justify-content:center;gap:10px;margin-top:4px}
  .nudge{border:1.5px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 16px;font-family:var(--font-d);font-weight:700;font-size:15px;cursor:pointer}
  .nudge:active{transform:scale(.96)}

  /* ---------- landing chooser ---------- */
  .landing-opt{position:relative;text-align:left;width:100%;cursor:pointer;background:var(--bg);background:color-mix(in srgb, var(--accent) 2%, white);color:var(--ink);border:1.5px solid var(--accent);border-radius:var(--radius);padding:20px 46px 20px 20px;box-shadow:var(--shadow);transition:transform .14s var(--ease),border-color .2s var(--ease)}
  .landing-opt:hover{border-color:var(--accent)}
  .landing-opt:active{transform:scale(.99)}
  .landing-opt__t{font-family:var(--font-d);font-weight:700;font-size:21px}
  .landing-opt__d{color:var(--ink-dim);font-size:14px;line-height:1.4;margin-top:5px}
  .landing-opt__arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:22px}
  /* schedule cards: the landing card teases today, tapping opens the week */
  .lo-special{color:var(--ink-dim);font-size:14.5px;line-height:1.45;margin-top:5px;white-space:pre-line}
  .lo-special b{font-weight:600;color:var(--ink-dim)}   /* the day name reads as a label, never louder than the card name */
  .spd{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm)}
  .spd + .spd{margin-top:10px}
  .spd__day{flex:none;width:78px;font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--ink-dim);padding-top:1px}
  .spd__t{flex:1;font-size:15px;line-height:1.45;white-space:pre-line}
  .spd__tag{flex:none;align-self:flex-start;background:var(--accent);color:var(--on-accent);font-family:var(--font-d);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 9px;margin-left:8px}
  .spd.today{border:1.5px solid var(--accent)}
  .spd.today{background:color-mix(in srgb, var(--accent) 4%, white)}
  .spd.today .spd__day{color:var(--accent)}
  /* landing cards: the quiet inline notice, and list-card rows */
  a.landing-opt{display:flex;text-decoration:none;color:var(--ink)}
  .ncard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .ncard__k{font-family:var(--font-d);font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:13px;color:var(--accent-deep);margin-bottom:5px}
  .ncard__t{font-size:15px;line-height:1.5;white-space:pre-line}
  .ncard{position:relative}
  a.ncard{display:block;text-decoration:none;color:var(--ink);cursor:pointer;padding-right:42px}
  a.ncard:active{transform:scale(.99)}
  .ncard__arrow{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--accent-deep);font-size:22px;line-height:1}
  .stack .promo{margin-top:0}
  .lr{display:flex;gap:12px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--line)}
  .lr__l{flex:1;min-width:0}
  .lr__n{font-family:var(--font-d);font-weight:700;font-size:16px}
  .lr__d{color:var(--ink-dim);font-size:14px;line-height:1.45;margin-top:3px}
  .lr__p{flex:none;margin-left:auto;font-family:var(--font-d);font-weight:700;font-size:15px;color:var(--accent-deep);white-space:nowrap}

  /* ---------- this or that ---------- */
  .totq{font-family:var(--font-d);font-weight:700;font-size:clamp(24px,6.6vw,30px);line-height:1.1;letter-spacing:-.01em;margin-bottom:4px}
  .totq .orw{color:var(--ink-faint);font-size:.62em;font-weight:600}
  .split{flex:1;display:grid;grid-template-rows:1fr auto 1fr;gap:0;margin:18px 0 8px;min-height:330px}
  .choice{border:1.5px solid var(--accent);background:var(--bg);color:var(--ink);cursor:pointer;border-radius:16px;font-family:var(--font-d);font-weight:700;font-size:23px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;line-height:1.12;box-shadow:var(--shadow-sm);transition:transform .12s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease)}
  .choice:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .choice:active{transform:scale(.985)}
  .split__seam{display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;color:var(--ink-faint);font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:12px 0;position:relative}
  .split__seam::before,.split__seam::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--line)}
  .split__seam::before{left:0}.split__seam::after{right:0}

  /* ---------- reveal ---------- */
  .reveal__picked{color:var(--ink-dim);font-size:14px;margin-bottom:20px}
  .reveal__picked b{color:var(--ink);font-weight:600}
  .bar-nums{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}
  .bar-num{font-family:var(--font-d);font-weight:800;font-size:clamp(34px,11vw,44px);line-height:.9}
  .bar-num.win{color:var(--accent)}
  .bar-num.lose{color:var(--ink-faint)}
  .bar-lab{font-size:12.5px;color:var(--ink-dim);margin-top:4px}
  .bar-lab.r{text-align:right}
  .verdict{font-family:var(--font-d);font-weight:700;font-size:clamp(22px,6vw,27px);line-height:1.15;margin-top:26px}
  .verdict span{color:var(--accent)}
  .progress{display:flex;gap:6px;margin-top:auto;padding-top:22px}
  .progress i{height:4px;flex:1;border-radius:3px;background:var(--line-2)}
  .progress i.on{background:var(--accent)}
  .progress i.done{background:var(--accent);opacity:.45}

  /* ---------- end card ---------- */
  .endcard{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;text-align:center;box-shadow:var(--shadow)}
  .endcard__score{font-family:var(--font-d);font-weight:800;font-size:64px;line-height:1;color:var(--accent)}
  .endcard__sub{color:var(--ink-dim);margin-top:8px;font-size:14px}
  .endcard__line{font-family:var(--font-d);font-weight:700;font-size:20px;margin-top:18px;line-height:1.2}

  /* ---------- who knows who (internal id: who_knows_who) ---------- */
  .players{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}
  .namechip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line-2);border-radius:999px;padding:9px 9px 9px 15px;font-weight:600;font-size:14px;box-shadow:var(--shadow-sm)}
  .namechip button{background:transparent;border:0;color:var(--ink-dim);cursor:pointer;font-size:16px;line-height:1;padding:2px}
  .nameadd{display:flex;gap:9px;margin-top:4px}
  .nameadd input{flex:1;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;color:var(--ink);padding:14px;font-family:var(--font-b);font-size:16px} /* 16px min: iOS zooms on focus below that */
  .nameadd input::placeholder{color:var(--ink-faint)}
  .nameadd input:focus{outline:none;border-color:var(--accent)}

  /* The advance button lives INSIDE .handoff so it centers with the text
     instead of sitting alone at the bottom of a mostly empty screen. */
  .handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .handoff .btn{margin-top:16px}
  .handoff__to{font-family:var(--font-d);font-weight:800;font-size:clamp(30px,9vw,42px);line-height:1.05}
  .handoff__role{color:#4a453e;font-size:18px;max-width:26ch;line-height:1.5}
  .handoff__pass{display:flex;align-items:center;gap:9px;color:var(--ink-dim);font-weight:600;font-size:16px;margin-bottom:6px}

      <button class="brand__back" id="backBtn" style="display:none" aria-label="Back">‹</button>

      <button class="brand__exit" id="exitBtn" style="display:none">Quit</button>
    </div>
    <div class="stage" id="stage"></div>
  </div>

<script src="config.js"></script>
<script src="brand.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════════
   ███  CONFIG — the only thing you set in this file  ███

   Everything else (venue branding, and every game + survey question) is read
   LIVE from Supabase, so adding a venue or editing a question is just a row
   edit in the Supabase table editor — no touching this file, no redeploy.

   To add a venue:    add a row to the `venues` table, set status = 'active'.
   To add / retire a  add a row, or set status = 'retired'. Never DELETE —
   question:          retiring keeps vote history and the per-device "already
                      answered" memory accurate.

   A venue's row id is its web tag + QR payload. Three entry points, so you can
   print EITHER a single QR (lands on the chooser) OR two QRs (skip straight in):
     <domain>/app.html?v=<id>            -> landing page  (single-QR design)
     <domain>/app.html?v=<id>&go=games   -> straight to games        (dual-QR)
     <domain>/app.html?v=<id>&go=box     -> straight to the box       (dual-QR)
   ════════════════════════════════════════════════════════════════════════ */
/* brand.js is generated by the dashboard Settings and committed into the
   fork; its keys override config.js one by one, so config.js only has to
   carry the Supabase keys (a full legacy config keeps working as fallback). */
const CFG = (window.OPERATOR_CONFIG || window.OPERATOR_BRAND) ? Object.assign({}, window.OPERATOR_CONFIG || {}, window.OPERATOR_BRAND || {}) : null;
if(!CFG || !CFG.supabaseUrl || !CFG.supabaseKey){
  document.body.innerHTML = '<div style="max-width:540px;margin:80px auto;font-family:system-ui,sans-serif;line-height:1.5;padding:0 20px"><h2>Almost there</h2><p>This page needs its operator config. In your fork, copy <code>public/config.example.js</code> to <code>public/config.js</code> and fill in your values. SETUP.md walks through it.</p></div>';
  throw new Error('missing config.js');
}
const SUPABASE_URL = CFG.supabaseUrl;
const SUPABASE_KEY = CFG.supabaseKey;
const GNAME = Object.assign({ who_knows_who: 'Who Knows Who', guess_the_split: 'Guess the Split', quick_pour: 'Quick Pour' }, CFG.gameNames || {});
/* favicon from operator config (the page itself wears venue branding) */
(function(){ try{
  const fav = document.querySelector('link[rel="icon"]'); if(!fav) return;
  const iconUrl = (typeof CFG.iconUrl === 'string' && CFG.iconUrl) ? CFG.iconUrl : '';
  const svg = (typeof CFG.logoSvg === 'string' && CFG.logoSvg.trim().startsWith('<svg')) ? CFG.logoSvg : '';
  const acc = /^#[0-9a-f]{6}$/i.test(CFG.accent || '') ? CFG.accent : '#3a6ea5';
  const ini = (CFG.brandName || '?').trim().charAt(0).toUpperCase();
  fav.href = iconUrl || 'data:image/svg+xml,' + encodeURIComponent(svg || '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="12" fill="' + acc + '"/><text x="32" y="44" font-family="sans-serif" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">' + ini + '</text></svg>');
  const ati = document.querySelector('link[rel="apple-touch-icon"]'); if(ati && iconUrl) ati.href = iconUrl;
}catch(e){} })();
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Filled in at boot from the database (see loadVenues / loadContent near the
   bottom). THIS OR THAT shares one pooled question bank across every venue on
   purpose — that's what makes a county-wide benchmark possible later. */
let VENUES = {};   // { id: { name, logo, accent, review } }
let TOT    = [];   // [{ id, a, b, count_a, count_b }]
let HS     = [];   // [{ q, opts:[4] }]
let TRIVIA = [];   // [{ q, opts:[correct, wrong, wrong, wrong] }]
let WORDS  = [];   // [{ id:"APPLE", vid }] — the word doubles as its permanent id
let WIY    = [];   // [{ id, cat, word }] — empty until 16_who_invited_you.sql runs
let FORTUNES = []; // [{ id, text, vid }] — empty until 20_fortune_teller.sql runs
let FORMS = {};    // feedback form config by id ('global' + venue ids) — empty until 35_feedback_forms.sql runs (stock form shows)
let ATCATS = [];   // [{ id, cat, vid }] — empty until 22_all_talk.sql runs

// SUGGESTION BOX — two PRIVATE ratings for the venue (food, service), then
// MARKET questions whose county-wide aggregate is the sellable product.
// Restaurant-rating averages are noise across venues; diner/market answers
// (what they value, how they found you) are what's worth benchmarking.
// "plate" and "visit" are single-pick: the ONE thing that matters most.
const SB_CORE = [
  { id:"food",      label:"How was the food?",    type:"rate" },
  { id:"service",   label:"How was the service?", type:"rate" },
  { id:"discovery", label:"How'd you end up here tonight?", type:"pill",
    options:["Word of mouth","Social media","Walked by","I'm a regular","Maps or search"] },
  { id:"plate",     label:"In the food itself, what matters most to you?", hint:"Pick one", type:"pill",
    options:["Quality ingredients","Healthy options","Big portions","Something new to try"] },
  { id:"visit",     label:"About the visit, what matters most?", hint:"Pick one", type:"pill",
    options:["Fast service","Good value","Friendly staff","Great atmosphere"] }
];

/* ════════════════════════════════════════════════════════════════════════
   APP  (you shouldn't need to edit below here)
   ════════════════════════════════════════════════════════════════════════ */
const stage   = document.getElementById('stage');
const backBtn = document.getElementById('backBtn');
const exitBtn = document.getElementById('exitBtn');
const brandLogo = document.getElementById('brandLogo');
const appEl = document.getElementById('app');

// Fallback venue for loads with no ?v= (dev previews, bare URL). MUST stay
// 'demo': it used to be offthehook, and every bare load was firing a real
// app_open analytics event on a real venue's row (13_events.sql logs for
// active venues). demo is the designated test row; noise there is expected.
let state = { venue:"demo", entry:"landing" };
let tot = {}, hs = {}, gs = {}, wiy = {}, sb = {};

function venue(){ return VENUES[state.venue]; }

// pick white or dark text for a given accent so it's always readable
function readableOn(hex){
  const c = hex.replace('#',''); if(c.length<6) return '#fff';
  const r=parseInt(c.substr(0,2),16)/255,g=parseInt(c.substr(2,2),16)/255,b=parseInt(c.substr(4,2),16)/255;
  const lin=x=> x<=0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4);
  const L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return L>0.55 ? '#1b1410' : '#ffffff';
}

function applyBranding(){
  const v = venue();
  // Per-venue dark mode (30_dark_mode.sql). Set here so the branding cache
  // paints it instantly on repeat visits, same as the accent. A missing
  // column (30 not run yet) reads as false: everyone stays light.
  document.documentElement.classList.toggle('dark', !!v.darkMode);
  // the browser tab carries the VENUE's name, not the platform's (the operator:
  // the only platform branding a diner should see is the URL itself)
  if(v.name) document.title = v.name;
  appEl.style.setProperty('--accent', v.accent);
  appEl.style.setProperty('--on-accent', readableOn(v.accent));
  const isUrl = /^(https?:\/\/|images\/)/i.test(v.logo || '');   // a URL, or a file shipped with the platform
  brandLogo.innerHTML = isUrl
    ? `<img class="brand__img" src="${v.logo}" alt="${v.name}" />`
    : `<span class="dot"></span><span>${v.logo || v.name}</span>`;
  brandLogo.setAttribute('aria-label', v.name + ', main menu');
  // Optional per-venue header background (23_header_bg.sql). White for
  // everyone by default; when set, the wordmark ink flips for contrast.
  // The back arrow and Quit stay accent-colored: the operator pairs header_bg with
  // the accent at onboarding.
  const bar = document.querySelector('.brand');
  if (v.headerBg){ bar.style.background = v.headerBg; brandLogo.style.color = readableOn(v.headerBg); }
  else { bar.style.background = ''; brandLogo.style.color = ''; }
  appEl.classList.add('branded');   // reveals the accent divider
}

/* Branding cache: repeat visits paint the venue's accent + logo instantly,
   before any network. Refreshed from the DB on every load, so a rebrand is
   at most one visit behind. */
function brandCacheKey(id){ return 'st_brand_' + id; }
function applyCachedBranding(id){
  try {
    const c = JSON.parse(lsGet(brandCacheKey(id)) || 'null');
    if (c && c.accent){ VENUES[id] = c; applyBranding(); }
  } catch(e){}
}
function saveBrandCache(id){
  try { lsSet(brandCacheKey(id), JSON.stringify(VENUES[id])); } catch(e){}
}

const screens = {};
function reg(id, fn){ screens[id] = fn; }
let current = null;
function go(id, opts){
  current = id;
  backBtn.style.display = (opts && opts.back) ? 'block' : 'none';
  exitBtn.style.display = (opts && opts.exit) ? 'block' : 'none';
  stage.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'screen is-active';
  stage.appendChild(el);
  screens[id](el, opts || {});
}
backBtn.onclick = ()=> { if (current && screens[current+'__back']) screens[current+'__back'](); };
exitBtn.onclick = ()=> go('hub');   // "Quit" always returns to the games hub
// Tapping the venue logo goes home to the chooser, the way a website header does.
// Ignored while a message screen is up (loading / offline / venue not set up):
// those leave `current` null, and the chooser needs a resolved venue.
brandLogo.onclick = ()=> { if (current && current !== 'landing' && VENUES[state.venue]) go('landing'); };
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
// For owner-typed text (card content) injected into templates. Venue names come
// from the operator's own rows, but escape them too when they share a template.
function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Owner-typed card link. The DB already enforces the same allowlist, but the
// page never renders a href it has not checked itself. http/https/mailto/tel
// only: javascript: or data: here would run on every diner's phone.
function safeUrl(u){ return /^(https?:\/\/|mailto:|tel:)/i.test(String(u || '')) ? String(u) : null; }

// Privacy screen: remember where we were so its back arrow can return there.
let privacyReturn = null;
function openPrivacy(){ privacyReturn = current; go('privacy',{back:true}); }

// Engagement metric: fire-and-forget log of a game start (server counts it only
// for an active venue). Never blocks the game or surfaces an error to the diner.
function logPlay(game){ try { db.rpc('log_game_play', { p_venue_id: state.venue, p_game: game }).then(()=>{}, ()=>{}); } catch(e){} logEvent('game_start', game); }
// Anonymous analytics event (13_events.sql). Unlike the rest of the app this
// logs for lead venues too: demo-scan tracking is the point. Fire and forget,
// harmless if the SQL add-on has not been run yet.
function logEvent(ev, meta){ try { db.rpc('log_event', { p_venue_id: state.venue, p_event: ev, p_meta: meta ?? null }).then(()=>{}, ()=>{}); } catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// Winner-screen celebration: a short burst from a point on screen (x,y are
// viewport coords). The layer is fixed, pointer-events:none, and removes
// itself, so it never eats a tap on the buttons underneath.
function confettiBurst(x,y){
  const colors=['#2e9e63','#3a6ea5','#d6a32b','#d1453b','#7b5ea7'];
  const layer=document.createElement('div'); layer.className='confetti-layer';
  document.body.appendChild(layer);
  for(let i=0;i<14;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.background=colors[i%colors.length];
    p.style.left=x+'px'; p.style.top=y+'px';
    const a=Math.random()*Math.PI*2, d=40+Math.random()*70;
    p.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    p.style.setProperty('--dy',(Math.sin(a)*d-30)+'px');
    p.style.animationDelay=(Math.random()*60)+'ms';
    layer.appendChild(p);
  }
  setTimeout(()=>layer.remove(),1100);
}
// Fire it off the crown once the screen has settled, so it reads as a reaction
// to the result rather than part of the page painting in.
function celebrateCrown(el){
  setTimeout(()=>{
    const c=el.querySelector('.crown'); if(!c) return;
    const b=c.getBoundingClientRect();
    confettiBurst(b.left+b.width/2, b.top+b.height/2);
  }, 220);
}

// Per-device "fresh questions first" memory. Each game keeps an ordered list
// of question ids this phone has already been SHOWN (oldest first). New decks
// deal unseen questions before recycling the least-recently-seen, so repeats
// only start once the whole pool has been played on this device. Keyed on the
// permanent question ids, and fails OPEN: if localStorage is blocked, decks
// are simply fully random like before.
function seenList(key){ try { const r=lsGet(key); return r?JSON.parse(r):[]; } catch(e){ return []; } }
function markSeen(key,id){ try { const a=seenList(key).filter(x=>x!==id); a.push(id); lsSet(key, JSON.stringify(a.slice(-400))); } catch(e){} }
function freshDeck(list, key, count){
  const rank = new Map(seenList(key).map((id,i)=>[id,i]));
  const idx = shuffle(list.map((_,i)=>i));
  // Custom-first: by the time decks are built, any item still carrying a vid
  // is THIS venue's paid custom content (filterContentForVenue dropped the
  // rest), so unseen custom rows (-2) deal before unseen shared ones (-1).
  // The venue's questions lead for every device that hasn't met them yet,
  // then everything recycles together, oldest-seen first.
  // stable sort: unseen (rank -1) keep their shuffled order and come first,
  // seen questions follow oldest-seen first
  const r = i => rank.has(list[i].id) ? rank.get(list[i].id) : (list[i].vid ? -2 : -1);
  idx.sort((a,b)=> r(a) - r(b));
  return count ? idx.slice(0,count) : idx;
}
const HS_ICONS=["🦊","🐼","🦉","🐙","🦁","🐸","🐧","🦄","🐯","🐨","🦝","🐢"];

/* ---------- device memory (localStorage) ----------
   A per-device backstop against casual double-counting, NOT fraud-proofing.
   It ALWAYS fails open: if storage is blocked we let the action count rather
   than break the experience. VPN / another phone / cleared data all bypass it,
   and that's fine — the real counting is enforced server-side. */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

// THIS OR THAT — a vote counts only the FIRST time this device answers a given
// question. Keyed on the permanent question id, so newly added/edited questions
// still count for returning players.
const TOT_VOTED_KEY = "st_gts_voted";
function totVoted(id){ try { const r=lsGet(TOT_VOTED_KEY); return r ? JSON.parse(r).includes(id) : false; } catch(e){ return false; } }
function totMarkVoted(id){ try { const r=lsGet(TOT_VOTED_KEY); const a=r?JSON.parse(r):[]; if(!a.includes(id)){ a.push(id); lsSet(TOT_VOTED_KEY, JSON.stringify(a)); } } catch(e){} }

// SURVEY — counts one submission per venue per calendar day.
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function surveyDoneToday(venueId){ return lsGet("st_survey_"+venueId) === todayStr(); }
function surveyMarkDone(venueId){ lsSet("st_survey_"+venueId, todayStr()); }

reg('landing', (el)=>{
  const V = venue();
  const dayKey = ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()];
  // Landing cards (schema 2): preset types only, owner-ordered, capped by the
  // sanitizer server-side. Each card renders in place, so the order the owner
  // sets is the order diners see below the two pinned rows.
  // "Last day shown" on notice cards, device-local like the day-of-week:
  // an until in the past hides the card in every mode
  const d0 = new Date();
  const todayYmd = d0.getFullYear() + '-' + String(d0.getMonth() + 1).padStart(2, '0') + '-' + String(d0.getDate()).padStart(2, '0');
  const cardsHtml = (V.cards || []).map((c, ix) => {
    if (!c || c.off) return '';
    if (c.t === 'notice' && c.until && c.until < todayYmd) return '';
    const ic = CARD_ICONS[c.icon] || CARD_ICONS.star;
    if (c.t === 'notice' && (c.mode || 'inline') === 'inline'){
      // hot = the saturated accent banner the owner promo used to be;
      // an optional link makes the whole banner tappable, arrow and all
      const u = safeUrl(c.url);
      const cls = c.hot ? 'promo' : 'ncard';
      const inner = c.hot
        ? `<div class="promo__k">${escHtml(c.title)}</div>${c.body ? `<div class="promo__t">${escHtml(c.body)}</div>` : ''}`
        : `<div class="ncard__k">${escHtml(c.title)}</div>${c.body ? `<div class="ncard__t">${escHtml(c.body)}</div>` : ''}`;
      return u
        ? `<a class="${cls}" data-cardix="${ix}" href="${escHtml(u)}" target="_blank" rel="noopener noreferrer"><span class="${c.hot ? 'promo__arrow' : 'ncard__arrow'}">›</span>${inner}</a>`
        : `<div class="${cls}">${inner}</div>`;
    }
    if (c.t === 'notice' && c.mode === 'link'){
      const u = safeUrl(c.url);
      if (!u) return '';
      return `
      <a class="landing-opt" data-cardix="${ix}" href="${escHtml(u)}" target="_blank" rel="noopener noreferrer">
        <span class="lo-ic" aria-hidden="true">${ic}</span>
        <span class="lo-body">
          <div class="landing-opt__t">${escHtml(c.title)}</div>
          ${c.desc ? `<div class="landing-opt__d">${escHtml(c.desc)}</div>` : ''}
        </span>
        <span class="landing-opt__arrow">›</span>
      </a>`;
    }
    let sub = c.desc ? `<div class="landing-opt__d">${escHtml(c.desc)}</div>` : '';
    if (c.t === 'schedule'){
      const today = (c.days || {})[dayKey];
      // no entry today hides the card, unless "always" keeps it up so diners
      // can still browse the rest of the week
      if (!today && !c.always) return '';
      // today's line carries the day name so a diner never wonders which day it is
      sub = today ? `<div class="lo-special"><b>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()]}:</b> ${escHtml(today)}</div>`
                  : `<div class="landing-opt__d">${escHtml(c.desc || 'Tap to view the calendar')}</div>`;
    }
    return `
      <button class="landing-opt" data-cardix="${ix}">
        <span class="lo-ic" aria-hidden="true">${ic}</span>
        <span class="lo-body">
          <div class="landing-opt__t">${escHtml(c.title)}</div>
          ${sub}
        </span>
        <span class="landing-opt__arrow">›</span>
      </button>`;
  }).join('');
  el.innerHTML = `
    <div class="stack" style="margin-top:4px">
      ${V.gamesEnabled === false ? '' : `<button class="landing-opt" id="toGames">
        <span class="lo-ic" aria-hidden="true">${CARD_ICONS.dice}</span>
        <span class="lo-body">
          <div class="landing-opt__t">Play a game</div>
          <div class="landing-opt__d">Pass the time, solo or with the whole table.</div>
        </span>
        <span class="landing-opt__arrow">›</span>
      </button>`}
      <button class="landing-opt" id="toBox">
        <span class="lo-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5c0 4.14-4.03 7.5-9 7.5-1.02 0-2-.14-2.91-.4L4 20l1.18-3.53C3.83 15.15 3 13.4 3 11.5 3 7.36 7.03 4 12 4s9 3.36 9 7.5z"/></svg></span>
        <span class="lo-body">
          <div class="landing-opt__t">Share feedback</div>
          <div class="landing-opt__d">Anonymous, and seen only by ${venue().name}.</div>
        </span>
        <span class="landing-opt__arrow">›</span>
      </button>
      ${cardsHtml}
    </div>
    <div class="spacer"></div>
    ${venue().demo ? `<div style="text-align:center;font-size:12px;color:var(--ink-faint,#a49d90);margin-bottom:6px">Preview. Built for ${escHtml(venue().name)} by ${escHtml(CFG.brandName)}. Not live yet.</div>` : ''}
    <div style="text-align:center"><button class="privacy-link" id="privacyLink">Privacy</button></div>`;
  el.querySelector('#toGames')?.addEventListener('click', ()=> go('hub'));
  el.querySelector('#toBox').onclick   = ()=> go('sb_intro');
  el.querySelector('#privacyLink').onclick = openPrivacy;
  // Card taps are worth counting the same way promo taps are: it is how the
  // owner knows a card earns its slot.
  el.querySelectorAll('[data-cardix]').forEach(n => {
    const ix = +n.dataset.cardix, c = (V.cards || [])[ix];
    n.addEventListener('click', ()=>{
      logEvent('card_open', c && c.t);
      if (n.tagName !== 'A'){ state.cardIx = ix; go('card'); }
    });
  });
});

/* ---------- GUESS THE SPLIT (internal id: guess_the_split) ----------
   Diner-facing rename + new flow. All internals unchanged on purpose:
   gts_questions, cast_gts_vote, st_seen_gts, the guess_the_split play counter.
   Flow: pick your side (this is the real vote, the community pool keeps
   growing), then call what percent of players picked it too, then the reveal
   scores you on how close your call was. Solo = 5 rounds, average miss.
   Group = 2 to 8 players take turns on the same question, lowest total miss
   after 5 rounds wins. */

// Count the vote only the first time this device answers this question. The
// server function itself only records for an ACTIVE venue, so a lead's demo
// tap still shows the split but changes no counter.
async function castTotVoteOnce(item, side){
  let ca = item.count_a, cb = item.count_b;
  if(!totVoted(item.id)){
    try {
      const { data, error } = await db.rpc('cast_gts_vote', { p_question_id:item.id, p_side:side, p_venue_id:state.venue });
      if(!error && data && data.length){ ca=data[0].count_a; cb=data[0].count_b; item.count_a=ca; item.count_b=cb; }
    } catch(e){ /* offline: fall back to the counts we loaded */ }
    totMarkVoted(item.id);
  }
  return [ca, cb];
}

// Shared pick UI: two big choice buttons. cb(side) on tap.
function totPickHtml(item){
  return `
    <div class="hsq__sub" style="margin-bottom:10px">First, cast your own vote.</div>
    <div class="totq">${item.a}<br><span class="orw">or</span><br>${item.b}?</div>
    <div class="split">
      <button class="choice" data-side="a">${item.a}</button>
      <div class="split__seam">vs</div>
      <button class="choice" data-side="b">${item.b}</button>
    </div>`;
}

// Shared split picker: both choices flank the slider, each with its own live
// percent (always summing to 100). cb(percent for choice A) on lock.
function totGuessUI(box, item, pickedName, cb){
  box.innerHTML = `
    <div class="hsq" style="margin-bottom:2px">Now guess the split.</div>
    <div class="hsq__sub">You voted <b>${pickedName}</b>. How did all diners split their votes?</div>
    <div class="bar-nums" style="margin-top:18px">
      <div><div class="bar-num" id="gvA">50%</div><div class="bar-lab">${item.a}</div></div>
      <div><div class="bar-num" id="gvB">50%</div><div class="bar-lab r">${item.b}</div></div>
    </div>
    <input type="range" class="gslider" id="gslider" min="0" max="100" step="1" value="50" aria-label="Split between ${item.a} and ${item.b}">
    <div class="nudges">
      <button class="nudge" data-d="-5">‹ 5</button>
      <button class="nudge" data-d="-1">‹ 1</button>
      <button class="nudge" data-d="1">1 ›</button>
      <button class="nudge" data-d="5">5 ›</button>
    </div>
    <button class="btn" id="lockBtn" style="margin-top:20px">Lock it in ›</button>`;
  const slider=box.querySelector('#gslider');
  const vA=box.querySelector('#gvA'), vB=box.querySelector('#gvB');
  // The dot leans TOWARD the bigger side: dragging it left (toward choice A's
  // label) raises A's percent. So A reads 100 minus the raw slider value.
  const aVal=()=> 100-(+slider.value);
  function paint(){ vA.textContent=aVal()+'%'; vB.textContent=(100-aVal())+'%'; }
  slider.addEventListener('input', paint);
  box.querySelectorAll('.nudge').forEach(b=> b.onclick=()=>{
    slider.value=Math.max(0,Math.min(100,(+slider.value)+(+b.dataset.d)));
    paint();
  });
  box.querySelector('#lockBtn').onclick=()=> cb(aVal());
}

// Shared reveal: just the two percentages, counting up from 50 to the real
// split. There is deliberately NO proportional bar here. The guess slider is a
// pointer (drag it toward the side you think wins), while a stacked bar is an
// area (the seam marks A's share), so the same divider would move the opposite
// way for the same answer. The numbers are the score anyway: the miss is
// |your call - real|, and .bar-num.win still colors the winning side.
function totNumsHtml(item, aPct, bPct, side){
  return `
    <div class="bar-nums">
      <div><div class="bar-num ${side==='a'?'win':'lose'}" data-t="${aPct}">50%</div><div class="bar-lab">${item.a}</div></div>
      <div><div class="bar-num ${side==='b'?'win':'lose'}" data-t="${bPct}">50%</div><div class="bar-lab r">${item.b}</div></div>
    </div>`;
}
function totAnimateNums(el){
  el.querySelectorAll('.bar-num').forEach(n=>{
    const target=+n.dataset.t, t0=performance.now(), dur=1050, from=50;
    (function tick(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);n.textContent=Math.round(from+(target-from)*e)+'%';if(p<1)requestAnimationFrame(tick);})(t0);
  });
}
function totMissLine(miss){
  if(miss===0)  return 'Perfect call.';
  if(miss<=2)   return 'Dead on.';
  if(miss<=5)   return 'Nailed it.';
  if(miss<=12)  return 'Close call.';
  if(miss<=25)  return 'The crowd drifted on you.';
  return 'Way off.';
}

reg('tot', (el)=>{

reg('gs_reveal', async (el)=>{
  const item=gs.item;
  const [ca,cb] = await (gs.voteP || Promise.resolve([item.count_a,item.count_b]));
  const total=(ca+cb)||1;
  const aPct=Math.round(ca/total*100), bPct=100-aPct;
  const majoritySide = aPct>=bPct?'a':'b';

  // Every guess is a full split (percent for choice A), so everyone is scored
  // against the same number no matter which side they voted for.
  const misses={};
  gs.players.forEach(p=>{
    misses[p]=Math.abs(gs.guesses[p]-aPct);
    gs.scores[p]+=misses[p];
  });

  const sorted=[...gs.players].sort((a,b)=>gs.scores[a]-gs.scores[b]);
  const best=gs.scores[sorted[0]];
  const rows=sorted.map((p,i)=>{
    const m=misses[p];
    const cls = m<=5?'':(m<=15?' delta--hs':' delta--wrong');
    const badge=`<span class="delta${cls}">${m===0?'Spot on':'Off by '+m}</span>`;
    const lead=gs.scores[p]===best;
    return `<div class="scorerow ${lead?'lead':''}"><span class="who"><span class="rank">${i+1}</span><span class="pico">${gs.icon[p]||''}</span>${p}${badge}</span><span class="pts">${gs.scores[p]}</span></div>`;
  }).join('');

  el.innerHTML=`
    <div class="eyebrow">Round ${gs.round+1} of ${gs.deck.length} · the split</div>
    <div class="totq" style="font-size:21px">${item.a} <span class="orw">or</span> ${item.b}?</div>
    ${totNumsHtml(item, aPct, bPct, majoritySide)}
    <button class="btn" id="cont" style="margin:18px 0 4px">${gs.round+1<gs.deck.length?'Next round ›':'See who wins ›'}</button>
    <div class="standings__h">Standings · total miss, low wins</div>
    <div class="scoreboard">${rows}</div>
    <div class="spacer"></div>`;
  totAnimateNums(el);
  el.querySelector('#cont').onclick=()=>{
    gs.round++;
    gs.round<gs.deck.length ? beginGsRound() : go('gs_final',{exit:true});
  };
});
reg('gs_final', (el)=>{
  const sorted=[...gs.players].sort((a,b)=>gs.scores[a]-gs.scores[b]);

      <div class="endcard__sub">${tie?'Dead even.':'Called the splits like a pollster.'}</div>

function beginRound(){

reg('hs_reveal', (el)=>{
  const correct=hs.guessers.filter(g=>hs.guesses[g]===hs.answer);
  correct.forEach(g=>hs.scores[g]+=1);
  let bonusName=null;
  if(hs.guessers.length>=3 && correct.length===1){bonusName=correct[0];hs.scores[bonusName]+=1;}

  const delta={}; hs.guessers.forEach(g=>{ if(hs.guesses[g]===hs.answer) delta[g]=(g===bonusName?2:1); });

  const sorted=[...hs.players].sort((a,b)=>hs.scores[b]-hs.scores[a]);
  const top=hs.scores[sorted[0]];
  const rows=sorted.map((p,i)=>{

    let badge='';
    if(p===hs.subject) badge=`<span class="delta delta--hs">In the spotlight</span>`;
    else if(delta[p]) badge=`<span class="delta">Correct +${delta[p]}</span>`;
    else badge=`<span class="delta delta--wrong">Incorrect</span>`;
    return `<div class="scorerow ${lead?'lead':''}"><span class="who"><span class="rank">${i+1}</span><span class="pico">${hs.icon[p]||''}</span>${p}${badge}</span><span class="pts">${hs.scores[p]}</span></div>`;
  }).join('');

  el.innerHTML=`
    <div class="eyebrow">The reveal</div>
    <div class="hsq" style="margin-bottom:14px">${qWithName()}</div>
    <div class="optlist" id="opts"></div>

    <div class="standings__h">Standings · round ${hs.turn+1} of ${hs.order.length}</div>
    <div class="scoreboard">${rows}</div>
    <div class="spacer"></div>`;
  const list=el.querySelector('#opts');
  hs.opts.forEach((o,idx)=>{
    const isPick=idx===hs.answer;
    const here=hs.guessers.filter(g=>hs.guesses[g]===idx);
    const icons=here.map(g=>`<span class="gi">${hs.icon[g]}</span>`).join('');
    const guessRow=icons?`<div class="opt__guessers"><span class="glabel">Guessers</span>${icons}</div>`:'';
    const meta=guessRow?`<div class="opt__meta">${guessRow}</div>`:'';
    const said=isPick?`<div class="opt__said"><span class="gi">${hs.icon[hs.subject]}</span><span class="glabel">${hs.subject} said</span></div>`:'';
    list.appendChild(h(`<button class="opt opt--reveal ${isPick?'was':'wrong'}" disabled style="cursor:default">${said}<span class="opt__t">${o}</span>${meta}</button>`));
  });
  el.querySelector('#cont').onclick=()=>{
    hs.turn++;
    hs.turn<hs.order.length ? beginRound() : go('hs_final',{exit:true});
  };
});
reg('hs_final', (el)=>{

  const tie=winners.length>1;

    return `<div class="scorerow ${lead?'lead':''}"><span class="who"><span class="rank">${i+1}</span><span class="pico">${hs.icon[p]||''}</span>${p}</span><span class="pts">${hs.scores[p]}</span></div>`;

  el.querySelector('#home').onclick=()=>go('hub');
});

/* ---------- WHO INVITED YOU? (internal id: who_invited_you) ----------
   Social deduction, 3 to 8 players, one phone. Everyone is dealt the same
   secret word except one random player, who only gets the category and has
   to blend in. The app deals and reveals; the talking, pointing, and scoring
   all happen at the table. No server writes beyond the play counter. */
reg('wiy_intro', (el)=>{
  el.innerHTML = `
    <div class="eyebrow">Who Invited You?</div>

      <div class="howto__step"><span class="howto__n">2</span><span>Go around the table. Each player says one word that hints at the secret word. The fake has to bluff along.</span></div>
      <div class="howto__step"><span class="howto__n">3</span><span>Everyone points at their suspect at the same time. Catch the fake and they get one last chance: guess the secret word and they steal the win.</span></div>
    </div>
    <button class="btn" id="toSetup">Add players ›</button>
    <div class="spacer"></div>`;
  el.querySelector('#toSetup').onclick=()=>{ wiy={players:[]}; go('wiy_setup',{exit:true}); };
});
reg('wiy_setup', (el)=>{
  el.innerHTML=`
    <div class="eyebrow">Who Invited You? · setup</div>
    <h1 class="big">Who's playing?</h1>
    <p class="lede">Add everyone at the table. 3 to 8 players.</p>
    <div class="players" id="chips"></div>
    <div class="nameadd">
      <input id="nameInput" placeholder="Add a name" autocomplete="off" maxlength="14" />
      <button class="btn sm" id="addBtn" style="padding-left:20px;padding-right:20px">Add</button>
    </div>
    <div class="namehint" id="nameHint"></div>
    <button class="btn" id="startWiy" style="margin-top:14px;${wiy.players.length<3?'opacity:.4':''}" ${wiy.players.length<3?'disabled':''}>Start ›</button>
    <div class="spacer"></div>`;
  const chips=el.querySelector('#chips'), input=el.querySelector('#nameInput');
  if(!wiy.icon) wiy.icon={};
  if(!wiy.iconPool) wiy.iconPool=shuffle(HS_ICONS);
  function renderChips(){
    chips.innerHTML='';
    wiy.players.forEach((p,idx)=>{
      const c=h(`<span class="namechip"><span class="pico">${wiy.icon[p]||''}</span> ${p}<button aria-label="Remove ${p}">×</button></span>`);
      c.querySelector('button').onclick=()=>{const nm=wiy.players[idx];wiy.players.splice(idx,1);delete wiy.icon[nm];renderChips();refreshStart();};
      chips.appendChild(c);
    });
  }
  // Pending typed name counts toward the minimum; Start adds it (see below).
  function refreshStart(){const b=el.querySelector('#startWiy');const ok=wiy.players.length+(input.value.trim()?1:0)>=3;b.disabled=!ok;b.style.opacity=ok?'1':'.4';}
  const hint=el.querySelector('#nameHint');
  function add(){
    const v=input.value.trim();
    if(!v)return false;
    if(wiy.players.length>=8){hint.textContent="That's the max of 8 players. Remove someone first.";return false;}
    if(wiy.players.some(p=>p.toLowerCase()===v.toLowerCase())){hint.textContent='Someone already has that name. Add a last initial?';return false;}
    const used=new Set(Object.values(wiy.icon));
    wiy.icon[v]=wiy.iconPool.find(x=>!used.has(x))||HS_ICONS[Object.keys(wiy.icon).length%HS_ICONS.length];
    hint.textContent=''; wiy.players.push(v);input.value='';input.focus();renderChips();refreshStart();
    return true;
  }
  el.querySelector('#addBtn').onclick=()=>{ add(); };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter')add(); else hint.textContent=''; });
  input.addEventListener('input', refreshStart);
  el.querySelector('#startWiy').onclick=()=>{
    // A name left in the box is meant to be a player, not discarded.
    if(input.value.trim() && !add()){ input.focus(); return; }
    if(wiy.players.length<3)return;
    logPlay('who_invited_you');
    wiy.deck=freshDeck(WIY,'st_seen_wiy');
    wiy.round=0; beginWiyRound();
  };
  renderChips();
});

  el.querySelector('#chTo21').onclick = ()=>{ ch.opt.target=21; el.querySelector('#chTo21').classList.add('on'); el.querySelector('#chTo11').classList.remove('on'); };
  scHint();
  el.querySelector('#chStart').onclick = ()=>{
    const nm = id => el.querySelector(id).value.trim();
    logPlay('cornhole');
    ch.game = { mode:'teams', target: ch.opt.target, scoring: ch.opt.scoring,
      red:  { players: [nm('#chR1') || 'Red 1',  nm('#chR2')].filter(Boolean), score: 0 },
      blue: { players: [nm('#chB1') || 'Blue 1', nm('#chB2')].filter(Boolean), score: 0 },
