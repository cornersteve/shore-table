<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Operator Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='10'%20y='10'%20width='44'%20height='44'%20rx='11'%20fill='%233a6ea5'/%3E%3Cpath%20d='M18%2024Q21.5%2020.4%2025%2024T32%2024T39%2024T46%2024M18%2033Q21.5%2029.4%2025%2033T32%2033T39%2033T46%2033M18%2042Q21.5%2038.4%2025%2042T32%2042T39%2042T46%2042'%20fill='none'%20stroke='%23fff'%20stroke-width='3.4'%20stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     PLATFORM · admin.html · the OPERATOR dashboard.
     Not diner-facing, not owner-facing. Requires the operator's
     Supabase Auth login (email + password); inert for anyone else.
     Slice 1: venue management end to end. See 25_operator_admin.sql.
     ============================================================ */
  :root{
    --bg:#ffffff;--page:#f6f4f0;--panel:#faf9f6;--panel-2:#efece6;
    --ink:#16110a;--ink-dim:#6d6759;--ink-faint:#a49d90;
    --line:rgba(22,17,10,.09);--line-2:rgba(22,17,10,.18);
    --good:#2e9e63;--bad:#b3372f;--warn:#b98a1c;--accent:#3a6ea5;--accent-soft:#eaf1f8;
    --radius:16px;
    --font-d:"Bricolage Grotesque",system-ui,sans-serif;
    --font-b:"Hanken Grotesk",system-ui,sans-serif;
    --shadow-sm:0 1px 2px rgba(22,17,10,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-b);color:var(--ink);background:var(--page);line-height:1.5;padding:0 16px 60px}
  .wrap{max-width:880px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;border-bottom:1px solid var(--line-2);margin-bottom:22px}
  .wordmark{font-family:var(--font-d);font-weight:800;letter-spacing:.03em;font-size:16px;text-transform:uppercase;display:inline-flex;align-items:center;gap:9px;color:var(--ink)}
  .wordmark svg{width:24px;height:24px;flex:none}
  .wm-mark svg,.wm-mark img{width:100%;height:100%;display:block;object-fit:contain}
  .wm-img{height:24px;width:auto;display:block}
  .wm-mark{width:24px;height:24px;border-radius:7px;background:#3a6ea5;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
  .optag{font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);display:flex;gap:14px;align-items:center}
  .signout{background:none;border:0;color:var(--ink-dim);font-size:13px;cursor:pointer;text-decoration:underline;min-height:44px;padding:0 4px}
  h1{font-family:var(--font-d);font-weight:700;font-size:clamp(22px,5vw,30px);line-height:1.1;margin:2px 0 14px}
  section{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:14px}
  section h2{font-family:var(--font-d);font-weight:700;font-size:16px;margin-bottom:4px}
  section .hint{color:var(--ink-dim);font-size:13px;margin-bottom:12px}
  .btn{font-family:var(--font-d);font-weight:700;font-size:14px;border:0;border-radius:11px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line-2)}
  .btn.danger{background:var(--bad)}
  .btn.sm{font-size:13px;padding:9px 14px;min-height:44px}
  .btn.saved,.btn.saved:active{background:var(--panel-2);color:var(--ink-dim);box-shadow:none;cursor:default;transform:none}
  .btn.off{opacity:.45}
  .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .tabs{display:flex;gap:4px;background:var(--bg);border:1.5px solid var(--line-2);border-radius:14px;padding:4px;margin:0 0 18px;position:sticky;top:62px;z-index:5;box-shadow:var(--shadow-sm)}
  .tab{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-family:var(--font-d);font-weight:700;font-size:14.5px;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
  .tab:hover{background:var(--panel-2)}
  .tab.on,.tab.on:hover{background:var(--accent);color:#fff}
  .pane{display:none}.pane.on{display:block}
  .saverow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
  .saverow .msg{margin:0}
  .chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:6px;align-items:baseline}
  .chip b{font-size:17px}.chip span{color:var(--ink-dim);font-size:13px}
  /* inline confirm strips: the answer sits where the question is, never a browser dialog */
  .confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:#fbeceb;font-size:14px;border-radius:0 0 14px 14px}
  .confirm b{flex:1 1 100%}
  .confirm.free{border:1px solid var(--line-2);border-radius:12px;margin-top:10px}
  .confirm.calm{background:var(--panel-2)}
  .cbox{scroll-margin-top:72px}
  input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
  .ck{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;color:var(--ink);margin-top:10px;cursor:pointer}
  .ck input{margin-top:2px}
  .ck small{display:block;font-size:13px;color:var(--ink-dim);margin-top:2px}
  .grow{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
  .grow:last-child{border-bottom:0}
  .gmove{display:flex;gap:6px;flex:none}
  .cfl{display:block;font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim);margin:12px 0 5px}
  .cfl:first-child{margin-top:0}
  .sprow{display:flex;align-items:center;gap:10px;margin-top:8px}
  .sprow label{flex:none;width:44px;font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
  .sprow.today label{color:var(--accent)}
  .sprow.today input{background:var(--accent-soft)}
  .kind{border:1px solid var(--line-2);border-radius:14px;padding:12px;margin-top:10px;background:var(--panel)}
  .kind h4{font-family:var(--font-d);font-weight:700;font-size:14.5px;margin:0 0 4px}
  .kindopt{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;min-height:56px;padding:10px 14px;border:1px solid var(--line-2);border-radius:12px;background:#fff;margin-top:8px;font-family:var(--font-b);color:var(--ink);cursor:pointer;line-height:1.3}
  .kindopt:hover{border-color:var(--accent)}
  .kindopt b{font-weight:700;font-size:15px}
  .kindopt span{font-size:13px;color:var(--ink-dim)}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.cur:disabled{opacity:1;cursor:default}
  input[type=text],input[type=email],input[type=url],input[type=password],textarea{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;font-family:var(--font-b);font-size:16px;color:var(--ink);background:var(--bg)}
  textarea{resize:none;display:block}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
  input::placeholder,textarea::placeholder{color:var(--ink-faint);opacity:1}
  label.f{display:block;font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 6px}
  .frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=color]{width:52px;height:40px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);padding:2px;cursor:pointer}
  .msg{font-size:13.5px;font-weight:600;min-height:18px;margin-top:8px}
  .msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
  .back{background:var(--accent);border:0;border-radius:999px;color:#fff;font-family:var(--font-d);font-weight:700;font-size:14px;cursor:pointer;padding:0 18px 0 12px;margin-bottom:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;position:sticky;top:8px;z-index:6;box-shadow:0 2px 10px rgba(22,17,10,.14)}
  .back:hover{filter:brightness(.9)}
  .back svg{width:18px;height:18px}

  /* venue list */
  .vrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;margin-bottom:9px;box-shadow:var(--shadow-sm)}
  /* tools: tiles, not buttons; the same object as a venue row, laid out as a grid */
  .tools{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:0 0 22px}
  .tool{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:44px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow-sm);font-family:var(--font-b);color:var(--ink)}
  .tool:hover{border-color:var(--accent)}
  .tool__ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .tool__ic svg{width:20px;height:20px}
  .tool.primary .tool__ic{background:var(--accent);color:#fff}
  .tool__t{font-family:var(--font-d);font-weight:700;font-size:15px;line-height:1.2}
  .tool__d{font-size:12.5px;color:var(--ink-dim);line-height:1.35}
  .vrow:hover{border-color:var(--accent)}
  .vdot{width:14px;height:14px;border-radius:4px;flex:none}
  .vname{font-family:var(--font-d);font-weight:700;font-size:15.5px}
  .vid{color:var(--ink-dim);font-size:12.5px}
  .vgroup{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim);margin:18px 0 8px}
  .vfold{margin-top:18px}
  .vfold summary{cursor:pointer;font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim);padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
  .vfold summary::-webkit-details-marker{display:none}
  .vfold summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
  .vfold[open] summary::before{transform:rotate(45deg)}
  .vfold[open] summary{margin-bottom:8px}
  .vspacer{margin-left:auto;display:flex;align-items:center;gap:10px}
  .badge{font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;border-radius:999px;padding:4px 10px;vertical-align:middle}
  .badge.lead{background:#f3ecd9;color:#7a5a0f}
  .badge.active{background:#e7f5ec;color:#1f7a4a}
  .badge.inactive{background:var(--panel-2);color:var(--ink-faint)}

  /* demo watch */
  .dwrow{display:flex;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
  .dwrow:last-child{border-bottom:0}
  .dwv{font-weight:700;min-width:110px}
  .dwt{color:var(--ink-faint);margin-left:auto;white-space:nowrap}

  /* add/edit form + preview */
  .split{display:grid;gap:16px}
  @media(min-width:760px){.split{grid-template-columns:1fr 300px;align-items:start}}
  .radio{display:flex;gap:14px;font-size:14px}
  .radio label{display:flex;gap:6px;align-items:center;cursor:pointer}
  /* autofill: logo candidates + place picker */
  .cands{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .cand{width:74px;height:74px;border:2px solid var(--line-2);border-radius:10px;background:#fff;cursor:pointer;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .cand img{max-width:64px;max-height:64px;object-fit:contain}
  .cand:hover,.cand.sel{border-color:var(--accent)}
  .swatches{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:9px;border:2px solid var(--line-2);cursor:pointer}
  .iconbtn{width:44px;height:44px;border:1px solid var(--line-2);border-radius:11px;background:var(--bg);color:var(--ink-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
  .iconbtn:disabled{opacity:.35;cursor:default}
  .iconbtn:active{background:var(--panel-2)}
  /* home screen cards editor */
  .cbox{border:1px solid var(--line-2);border-radius:14px;margin-top:10px;background:var(--bg);box-shadow:var(--shadow-sm)}
  .cbox.isoff{opacity:.55}
  .cbox__head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px}
  .cbox__main{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:var(--font-b);color:var(--ink)}
  .cbox__ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .cbox__ic svg{width:20px;height:20px;display:block}
  .cbox__tt{flex:1;min-width:0;display:flex;flex-direction:column}
  .cbox__t{min-width:0;font-family:var(--font-d);font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cbox__type{font-size:12.5px;color:var(--ink-dim)}
  .cbox__why{font-size:12.5px;color:var(--bad);font-weight:600;margin-top:2px}
  .cbox__chev{flex:none;color:var(--ink-dim);width:22px;text-align:center;transition:transform .15s}
  .cbox__ctl{display:flex;gap:8px;flex:none}
  @media (max-width:480px){ .cbox__head{flex-wrap:wrap} .cbox__main{flex:1 1 100%} .cbox__ctl{width:100%;justify-content:flex-end;padding-top:2px} }
  .cbox.open .cbox__chev{transform:rotate(90deg)}
  .cbox__body{border-top:1px solid var(--line);padding:12px}
  .cbox textarea{width:100%;min-height:84px;border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;font-family:var(--font-b);font-size:15px;color:var(--ink);background:var(--bg);resize:vertical}
  input[type=date],input[type=number]{min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:9px 10px;font-family:var(--font-b);font-size:14px;color:var(--ink);background:var(--bg)}
  .icongrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .icopt{width:44px;height:44px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg);color:var(--ink-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .icopt svg{width:19px;height:19px}
  .icopt.sel{border:1.5px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
  .lirow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .lirow input{min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:9px 10px;font-family:var(--font-b);font-size:14px;color:var(--ink);background:var(--bg)}
  .lirow .li-n{flex:1;min-width:130px}
  .lirow .li-p{width:76px;flex:none}
  .lirow .li-d{flex-basis:100%}
  .iconbtn svg{width:17px;height:17px}
  .iconbtn.off{color:var(--bad);border-color:rgba(179,55,47,.4)}
  .spcount{flex:none;width:58px;text-align:right;font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .sw:hover{border-color:var(--ink)}
  /* the live preview phone */
  .phone{background:var(--ink);border-radius:26px;padding:8px;box-shadow:0 14px 34px rgba(22,17,10,.18)}
  .phone .scr{background:#fff;border-radius:19px;overflow:hidden;min-height:340px;display:flex;flex-direction:column}
  .pv-brand{display:flex;align-items:center;justify-content:center;min-height:54px;padding:10px 14px;border-bottom:3px solid #ccc;box-shadow:0 2px 8px rgba(22,17,10,.08)}
  .pv-brand img{max-height:38px;max-width:150px;object-fit:contain}
  .pv-wordmark{font-family:var(--font-d);font-weight:800;letter-spacing:.03em;font-size:13px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
  .pv-wordmark .dot{width:6px;height:6px;border-radius:2px;transform:rotate(45deg)}
  .pv-body{padding:16px 14px;flex:1;display:flex;flex-direction:column;justify-content:center}
  .pv-opt{position:relative;border:1.5px solid #ccc;border-radius:13px;padding:12px 12px;margin-top:9px;background:#fff}
  .pv-opt .t{font-family:var(--font-d);font-weight:700;font-size:13px}
  .pv-opt .d{color:var(--ink-dim);font-size:11px}
  .pv-note{text-align:center;color:var(--ink-faint);font-size:11px;margin-top:12px}

  /* detail */
  /* link text on its own delineated line, the button group below it
     (the old single row wrapped awkwardly on phones) */
  .linkrow{display:flex;flex-direction:column;gap:8px;align-items:stretch;margin:6px 0 14px}
  .linkrow .lk{font-size:12.5px;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
  .linkbtns{display:flex;gap:8px;flex-wrap:wrap}
  .statusbtns{display:flex;gap:8px;flex-wrap:wrap}
  .mailbtns{display:flex;gap:8px;flex-wrap:wrap}
  .mailbtns .btn{text-decoration:none;display:inline-flex;align-items:center}
  select{border:1px solid var(--line-2);border-radius:10px;padding:10px 11px;font-family:var(--font-b);font-size:14.5px;color:var(--ink);background:var(--bg)}

  /* login */
  .center{max-width:420px;margin:70px auto;text-align:center}
  .center h1{margin-bottom:8px}
  .center p{color:var(--ink-dim);font-size:14.5px;margin-bottom:16px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;border-radius:999px;padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="wrap" id="page" style="display:none">
  <header>
    <span class="wordmark"><span class="wm-mark" aria-hidden="true"></span><span class="wm-name"></span></span>
    <span class="optag">Operator <button class="signout" id="signOut">sign out</button></span>
  </header>
  <div id="main"></div>
</div>

<div class="center" id="login" style="display:none">
  <h1>Operator sign in</h1>
  <div id="loginForm">
    <p>Sign in with the operator email and password.</p>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" style="text-align:center" />
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" style="text-align:center;margin-top:8px" />
    <button class="btn" id="loginBtn" style="margin-top:12px;width:100%">Sign in</button>
    <button class="btn ghost" id="pwForgot" style="margin-top:8px;width:100%">Set or reset password (email link)</button>
  </div>
  <div id="pwPanel" style="display:none">
    <p>Choose a new password for the operator account.</p>
    <input type="password" id="pwNew" placeholder="New password (8+ characters)" autocomplete="new-password" style="text-align:center" />
    <button class="btn" id="pwSave" style="margin-top:12px;width:100%">Save password</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="brand.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/shared.js?v=29"></script>
<script src="js/admin.js?v=29"></script>
</body>
</html>
